---
- name: Render audit policy to master
  template:
    src: audit-policy.yaml
    dest: /tmp/audit-policy.yaml
    mode: "0644"
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Create audit policy directory
  file:
    path: /etc/kubernetes/audit
    state: directory
    mode: "0755"
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Copy audit policy into Kubernetes config dir
  command: cp /tmp/audit-policy.yaml /etc/kubernetes/audit/policy.yaml
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Ensure kube-apiserver manifest contains audit-policy-file flag
  lineinfile:
    path: /etc/kubernetes/manifests/kube-apiserver.yaml
    regexp: '.*--audit-policy-file='
    line: '    - --audit-policy-file=/etc/kubernetes/audit/policy.yaml'
    insertafter: '    args:'
    state: present
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  notify: restart kubelet
  ignore_errors: yes


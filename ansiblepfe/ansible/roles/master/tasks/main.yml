---
- name: Render kubeadm config (hardening + audit)
  template:
    src: kubeadm-config.yml
    dest: /tmp/kubeadm-config.yml
    mode: "0644"

- name: Check if cluster is already initialized
  stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_already_init

- name: Reset cluster if forced
  command: kubeadm reset -f
  when:
    - force_reinit | default(false) | bool
    - kubeadm_already_init.stat.exists

- name: Clean etcd data if forced
  file:
    path: /var/lib/etcd
    state: absent
  when:
    - force_reinit | default(false) | bool
    - kubeadm_already_init.stat.exists

- name: Initialize Kubernetes cluster
  command: >
    kubeadm init
    --config /tmp/kubeadm-config.yml
    --upload-certs
  register: kubeadm_init
  run_once: true
  when: >
    not kubeadm_already_init.stat.exists or
    (force_reinit | default(false) | bool)
  failed_when: >
    kubeadm_init.rc != 0 and
    'addon/coredns' not in kubeadm_init.stderr

- name: Create .kube directory
  file:
    path: "{{ ansible_env.HOME }}/.kube"
    state: directory
    mode: "0755"

- name: Copy admin kubeconfig
  copy:
    src: /etc/kubernetes/admin.conf
    dest: "{{ ansible_env.HOME }}/.kube/config"
    remote_src: yes
    owner: "{{ ansible_user }}"
    mode: "0600"

- name: Ensure .kube directory exists for ubuntu user (optional)
  file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    mode: "0755"
  when: ansible_user != 'ubuntu'

- name: Copy kubeconfig for ubuntu user (optional)
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/ubuntu/.kube/config
    remote_src: yes
    owner: ubuntu
    mode: "0600"
  when: ansible_user != 'ubuntu'

- name: Generate join command for workers
  command: kubeadm token create --print-join-command
  register: join_cmd_output
  changed_when: false
  run_once: true

- name: Save join command to file for workers
  copy:
    content: "{{ join_cmd_output.stdout }}"
    dest: /tmp/join_command.sh
    mode: "0755"
  run_once: true
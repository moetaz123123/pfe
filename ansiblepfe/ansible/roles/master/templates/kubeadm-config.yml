# kubeadm configuration pour durcir l'API server (RBAC, audit, TLS) et les composants control-plane.
apiVersion: kubeadm.k8s.io/v1beta3
kind: ClusterConfiguration
kubernetesVersion: v1.28.0
controlPlaneEndpoint: "{{ groups['master'][0] }}:6443"
networking:
  podSubnet: "{{ pod_cidr }}"
  serviceSubnet: "{{ service_cidr }}"

apiServer:
  extraArgs:
    authorization-mode: "Node,RBAC"
    enable-admission-plugins: "NodeRestriction,NamespaceLifecycle,ServiceAccount"
    profiling: "false"

controllerManager:
  extraArgs:
    profiling: "false"

scheduler:
  extraArgs:
    profiling: "false"


---
# ============================================================
# KUBERNETES SECRETS MANAGEMENT
# ============================================================
# Automate creation and management of K8s Secrets

- name: "[K8S-SECRETS] Wait for API server availability"
  uri:
    url: "https://127.0.0.1:6443/readyz"
    validate_certs: no
    status_code: 200
  register: api_ready
  until: api_ready.status == 200
  retries: 30
  delay: 10
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  run_once: true

- name: "[K8S-SECRETS] Create secrets namespace"
  shell: |
    kubectl create namespace {{ secrets_namespace }} --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: secrets_ns
  changed_when: "'created' in secrets_ns.stdout"
  run_once: true

- name: "[K8S-SECRETS] Label secrets namespace for RBAC"
  shell: |
    kubectl label namespace {{ secrets_namespace }} \
    secrets-protection=enabled \
    pod-security.kubernetes.io/enforce=restricted \
    --overwrite
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  run_once: true

- name: "[K8S-SECRETS] Create TLS secret from files"
  shell: |
    kubectl create secret tls {{ tls_secret_name }} \
    --cert={{ tls_cert_path }} \
    --key={{ tls_key_path }} \
    -n default \
    --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: tls_secret
  changed_when: "'created' in tls_secret.stdout"
  when:
    - tls_cert_path is defined and tls_cert_path | length > 0 and tls_cert_path != '/path/to/tls.crt'
    - tls_key_path is defined and tls_key_path | length > 0 and tls_key_path != '/path/to/tls.key'
  ignore_errors: yes
  run_once: true

- name: "[K8S-SECRETS] Create registry credentials secret"
  shell: |
    kubectl create secret docker-registry regcred \
    --docker-server={{ registry_server | default('docker.io') }} \
    --docker-username={{ registry_user | default('') }} \
    --docker-password={{ registry_password | default('') }} \
    --docker-email={{ registry_email | default('') }} \
    -n default \
    --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: registry_secret
  changed_when: "'created' in registry_secret.stdout"
  when:
    - registry_user is defined and registry_user != ''
    - registry_password is defined and registry_password != ''
  no_log: true
  ignore_errors: yes
  run_once: true

- name: "[K8S-SECRETS] Deploy example application secrets"
  template:
    src: example-secrets.yaml.j2
    dest: /tmp/app-secrets.yaml
    owner: root
    group: root
    mode: "0600"
  run_once: true

- name: "[K8S-SECRETS] Apply application secrets"
  command: kubectl apply -f /tmp/app-secrets.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: app_secrets
  changed_when: "'created' in app_secrets.stdout or 'configured' in app_secrets.stdout"
  run_once: true

- name: "[K8S-SECRETS] Create RBAC for secrets access"
  template:
    src: secrets-rbac.yaml.j2
    dest: /tmp/secrets-rbac.yaml
    owner: root
    group: root
    mode: "0644"
  run_once: true

- name: "[K8S-SECRETS] Apply RBAC policies"
  command: kubectl apply -f /tmp/secrets-rbac.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: secrets_rbac
  changed_when: "'created' in secrets_rbac.stdout or 'configured' in secrets_rbac.stdout"
  run_once: true

- name: "[K8S-SECRETS] Create ServiceAccount for secrets access"
  shell: |
    kubectl create serviceaccount secrets-reader \
    -n {{ secrets_namespace }} \
    --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  run_once: true

- name: "[K8S-SECRETS] Verify encryption status"
  shell: |
    kubectl get secrets -A -o wide --sort-by=.metadata.creationTimestamp | head -20
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: secrets_status
  run_once: true

- name: "[K8S-SECRETS] Log secrets configuration"
  copy:
    content: |
      ============================================================
      Kubernetes Secrets Configuration Report
      ============================================================
      Generated: {{ ansible_date_time.iso8601 }}
      Cluster: {{ cluster_name }}
      
      Secrets Namespace: {{ secrets_namespace }}
      Encryption: ENABLED (AES-GCM at rest)
      
      Created Secrets:
      {{ secrets_status.stdout }}
      
      ServiceAccount: secrets-reader ({{ secrets_namespace }})
      RBAC: Applied
      
      ============================================================
    dest: /var/log/kubernetes/secrets-config.log
    owner: root
    group: root
    mode: "0644"
  run_once: true

---
# ============================================================
# SECRETS AUDIT AND LOGGING
# ============================================================
# Automate audit logging for all secret access

- name: "[SECRETS-AUDIT] Verify audit policy for secrets"
  stat:
    path: /etc/kubernetes/audit-policy.yaml
  register: audit_policy
  run_once: true

- name: "[SECRETS-AUDIT] Create secrets audit policy if missing"
  template:
    src: secrets-audit-policy.yaml.j2
    dest: /etc/kubernetes/audit-policy.yaml
    owner: root
    group: root
    mode: "0644"
  when: not audit_policy.stat.exists
  run_once: true

- name: "[SECRETS-AUDIT] Ensure audit log directory exists"
  file:
    path: /var/log/kubernetes
    state: directory
    owner: root
    group: root
    mode: "0755"
  run_once: true

- name: "[SECRETS-AUDIT] Create audit log file"
  file:
    path: "{{ audit_log_path }}"
    state: touch
    owner: root
    group: root
    mode: "0644"
  run_once: true

- name: "[SECRETS-AUDIT] Create cronjob for audit secret access analysis"
  cron:
    name: "Analyze secret access logs"
    minute: "*/30"
    job: "grep -i secret {{ audit_log_path }} | tail -100 >> /var/log/kubernetes/secrets-access.log 2>&1"
    user: root
    state: present
  run_once: true

- name: "[SECRETS-AUDIT] Create monitoring for secret rotation"
  template:
    src: secrets-rotation-check.sh.j2
    dest: /usr/local/bin/check-secrets-rotation.sh
    owner: root
    group: root
    mode: "0755"
  run_once: true

- name: "[SECRETS-AUDIT] Schedule secret rotation check"
  cron:
    name: "Check secrets rotation"
    weekday: "0"
    hour: "2"
    minute: "0"
    job: "/usr/local/bin/check-secrets-rotation.sh"
    user: root
    state: present
  run_once: true

- name: "[SECRETS-AUDIT] Query existing secrets in cluster"
  command: |
    kubectl get secrets -A \
    --sort-by=.metadata.creationTimestamp \
    -o jsonpath='{range .items[*]}{.metadata.namespace}{"/"}{.metadata.name}{"  "}{.metadata.creationTimestamp}{"\n"}{end}'
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: existing_secrets
  run_once: true

- name: "[SECRETS-AUDIT] Log all existing secrets"
  copy:
    content: |
      ============================================================
      Kubernetes Secrets Inventory Report
      ============================================================
      Generated: {{ ansible_date_time.iso8601 }}
      Cluster: {{ cluster_name }}
      
      ALL SECRETS IN CLUSTER:
      {{ existing_secrets.stdout }}
      
      NOTE: Encryption at rest is ENABLED for all secrets above.
      ============================================================
    dest: /var/log/kubernetes/secrets-inventory.log
    owner: root
    group: root
    mode: "0600"
  run_once: true

- name: "[SECRETS-AUDIT] Enable audit webhooks (optional)"
  template:
    src: audit-webhook-config.yaml.j2
    dest: /etc/kubernetes/audit-webhook.yaml
    owner: root
    group: root
    mode: "0644"
  when: enable_audit_webhooks | default(false) | bool
  run_once: true

- name: "[SECRETS-AUDIT] Print encryption summary"
  debug:
    msg: |
      ============================================================
      ✓ ENCRYPTION AT REST - CONFIGURED
      ============================================================
      Location: /etc/kubernetes/encryption/
      Key: {{ encryption_key[:32] }}... (hidden for security)
      Encryption: AES-GCM
      Target: All Kubernetes Secrets in etcd
      ============================================================
      ✓ K8S SECRETS - CREATED & PROTECTED
      ============================================================
      Secrets Namespace: {{ secrets_namespace }}
      Total Secrets: {{ existing_secrets.stdout_lines | length }}
      ============================================================
      ✓ AUDIT LOGGING - ENABLED
      ============================================================
      Audit Log: {{ audit_log_path }}
      Secret Access Logs: /var/log/kubernetes/secrets-access.log
      Inventory: /var/log/kubernetes/secrets-inventory.log
      ============================================================
  run_once: true

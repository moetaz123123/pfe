# Référence : promtail.yaml pour kubernetes-audit (aligné avec audit-logging.yml).
# Monter ce contenu dans un ConfigMap sous la clé promtail.yaml si vous externalisez la config.
---
server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /tmp/positions-audit.yaml
clients:
  - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
    batchwait: 2s
    batchsize: 1048576
    timeout: 30s
    backoff_config:
      min_period: 1s
      max_period: 5m
      max_retries: 15
scrape_configs:
  - job_name: kubernetes-audit
    static_configs:
      - targets:
          - localhost
        labels:
          job: kubernetes-audit
          host: {{ inventory_hostname }}
          cluster: {{ kubernetes_cluster_name | default('k8s-cluster') }}
          __path__: /var/log/kubernetes/audit.log

    pipeline_stages:
  - json:
      expressions:
        verb: verb
        stage: stage
        user: user
        objectRef: objectRef
        responseStatus: responseStatus
      on_error: keep
  - json:
      source: user
      expressions:
        username: username
      on_error: keep
  - json:
      source: objectRef
      expressions:
        namespace: namespace
        resource: resource
      on_error: keep
  - json:
      source: responseStatus
      expressions:
        statusCode: code
      on_error: keep

  # Normalise namespace absent → chaîne vide explicite
  - template:
      source: namespace
      template: '{{ if .Value }}{{ .Value }}{{ else }}{{ end }}'

  - labels:
      verb:
      stage:
      username:
      namespace:
      resource:
      statusCode:

  # DROP 1 : namespace vide (cluster-scoped, auth events, health checks)
  - drop:
      source: namespace
      value: ""
      drop_counter_reason: cluster_scoped_no_namespace

  # DROP 2 : filet de sécurité via selector Loki
  - match:
      selector: '{namespace=""}'
      action: drop

  # Drops anti-bruit existants
  - drop:
      expression: '.*allowWatchBookmarks.*'
      drop_counter_reason: watch_bookmarks
  - drop:
      source: stage
      value: RequestReceived
      drop_counter_reason: audit_stage_request_received
  - drop:
      source: stage
      value: ResponseStarted
      drop_counter_reason: audit_stage_response_started
  - drop:
      expression: '.*"verb":"watch".*"resource":"(endpoints|endpointslices)".*'
      drop_counter_reason: endpoints_watch_noise
  - drop:
      expression: '.*"verb":"(get|list|watch)".*"resource":"leases".*"username":"system:'
      drop_counter_reason: leader_election_leases

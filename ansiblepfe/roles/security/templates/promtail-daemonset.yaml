apiVersion: apps/v1
kind: ClusterRole
metadata:
  name: promtail-audit
  labels:
    app: promtail-audit
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
      - pods/log
      - configmaps
      - namespaces
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail-audit
  labels:
    app: promtail-audit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail-audit
subjects:
  - kind: ServiceAccount
    name: promtail-audit
    namespace: {{ monitoring_namespace | default('monitoring') }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: promtail-audit
  namespace: {{ monitoring_namespace | default('monitoring') }}
  labels:
    app: promtail-audit
rules:
  - apiGroups: [""]
    resources:
      - configmaps
    resourceNames:
      - promtail-audit-config
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: promtail-audit
  namespace: {{ monitoring_namespace | default('monitoring') }}
  labels:
    app: promtail-audit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: promtail-audit
subjects:
  - kind: ServiceAccount
    name: promtail-audit
    namespace: {{ monitoring_namespace | default('monitoring') }}

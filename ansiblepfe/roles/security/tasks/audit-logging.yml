# =============================================================================
# PARTIE 5 : LOKI VALUES + HELM DEPLOY AVEC NFS
# =============================================================================

- name: Deploy Loki values file with NFS persistence
  copy:
    dest: /tmp/loki-values.yaml
    content: |
      loki:
        enabled: true
        terminationGracePeriodSeconds: 30
        podManagementPolicy: Parallel

        # HA-03 : Persistence NFS (données survivent à la panne d'un worker)
        persistence:
          enabled: true
          storageClassName: nfs
          size: 5Gi
          accessModes:
            - ReadWriteOnce

        # HA-04 : nodeSelector vide → loki-0 peut migrer sur tout worker
        nodeSelector: {}

        # HA-05 : Préférence pour éviter master-01
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 80
                preference:
                  matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist

        # HA-06 : Tolerations élargies
        tolerations:
          - operator: Exists
            effect: NoSchedule
          - operator: Exists
            effect: NoExecute

        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 1500m
            memory: 4Gi

        config:
          auth_enabled: false
          server:
            http_listen_port: 3100
            http_listen_address: 0.0.0.0
            grpc_listen_address: 0.0.0.0
          common:
            path_prefix: /data/loki
            replication_factor: 1
            ring:
              kvstore:
                store: inmemory
            storage:
              filesystem:
                chunks_directory: /data/loki/chunks
                rules_directory: /data/loki/rules
          schema_config:
            configs:
              - from: "2020-10-24"
                store: boltdb-shipper
                object_store: filesystem
                schema: v11
                index:
                  prefix: index_
                  period: 24h
          limits_config:
            enforce_metric_name: false
            reject_old_samples: true
            reject_old_samples_max_age: 168h
            ingestion_rate_mb: 128
            ingestion_burst_size_mb: 256
            max_streams_per_user: 50000
            max_query_parallelism: 16
          query_scheduler:
            max_outstanding_requests_per_tenant: 2048
          querier:
            max_concurrent: 32

      promtail:
        enabled: false

      grafana:
        enabled: true
        deploymentStrategy:
          type: Recreate
        adminPassword: "{{ grafana_admin_password | default('Admin1234!') }}"
        service:
          type: NodePort
          nodePort: 32000
        env:
          GF_SERVER_HTTP_ADDR: "0.0.0.0"
        extraConfigmapMounts:
          - name: loki-datasource-provisioning
            mountPath: /etc/grafana/provisioning/datasources/loki-datasource.yaml
            subPath: loki-datasource.yaml
            configMap: loki-datasource-provisioning
            readOnly: true
          - name: grafana-dashboard-provisioning
            mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
            subPath: dashboards.yaml
            configMap: grafana-dashboard-provisioning
            readOnly: true
          - name: grafana-dashboard-audit
            mountPath: /var/lib/grafana/dashboards/kubernetes-audit.json
            subPath: kubernetes-audit.json
            configMap: grafana-dashboard-audit
            readOnly: true
          - name: grafana-dashboard-cluster
            mountPath: /var/lib/grafana/dashboards/cluster-logs.json
            subPath: cluster-logs.json
            configMap: grafana-dashboard-cluster
            readOnly: true
        grafana.ini:
          smtp:
            enabled: {{ grafana_smtp_enabled | default(true) | bool | ternary('true', 'false') }}
            host: "{{ smtp_host }}:{{ smtp_port }}"
            user: "{{ smtp_user }}"
            password: "{{ smtp_password }}"
            skip_verify: false
            from_address: "{{ smtp_from }}"
            from_name: "{{ project_name | default('Kubernetes') }} - Alertes"
          analytics:
            check_for_updates: false
            reporting_enabled: false
          dashboards:
            default_home_dashboard_path: /var/lib/grafana/dashboards/cluster-logs.json
          dataproxy:
            timeout: 300
            dial_timeout: 30
            keep_alive_seconds: 30
        resources:
          requests:
            cpu: 500m
            memory: 1000Mi
          limits:
            cpu: 1000m
            memory: 1536Mi
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 120
          timeoutSeconds: 30
          failureThreshold: 15
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 60
          timeoutSeconds: 30
          failureThreshold: 15
          periodSeconds: 10
        sidecar:
          datasources:
            enabled: false
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Deploy Loki + Grafana stack
  shell: |
    helm upgrade --install loki grafana/loki-stack \
      --namespace monitoring \
      --values /tmp/loki-values.yaml \
      --timeout 10m
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

# =============================================================================
# HA-GRAFANA : PERSISTENCE NFS POUR GRAFANA
# =============================================================================

- name: "[HA-GRAFANA] Create Grafana NFS PVC"
  shell: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: grafana-storage
      namespace: monitoring
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: nfs
      resources:
        requests:
          storage: 2Gi
    EOF
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: "[HA-GRAFANA] Wait for Grafana deployment to be available"
  shell: |
    kubectl rollout status deployment/loki-grafana -n monitoring --timeout=120s
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: "[HA-GRAFANA] Replace emptyDir storage with NFS PVC on Grafana"
  shell: |
    VOL_INDEX=$(kubectl get deployment loki-grafana -n monitoring \
      -o jsonpath='{.spec.template.spec.volumes}' | \
      python3 -c "
    import json, sys
    vols = json.load(sys.stdin)
    for i, v in enumerate(vols):
        if v.get('emptyDir') is not None and v.get('name') == 'storage':
            print(i)
            break
    " 2>/dev/null)

    if [ -z "$VOL_INDEX" ]; then
      echo "⚠ Volume 'storage' emptyDir introuvable — déjà patché ?"
      exit 0
    fi

    echo "→ Remplacement volume index $VOL_INDEX par PVC grafana-storage..."
    kubectl patch deployment loki-grafana -n monitoring --type=json -p="[
      {
        \"op\": \"replace\",
        \"path\": \"/spec/template/spec/volumes/${VOL_INDEX}\",
        \"value\": {\"name\": \"storage\", \"persistentVolumeClaim\": {\"claimName\": \"grafana-storage\"}}
      }
    ]"
    echo "✓ Grafana storage patché avec NFS PVC"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: "[HA-GRAFANA] Wait for Grafana to restart with NFS storage"
  shell: |
    kubectl rollout status deployment/loki-grafana -n monitoring --timeout=120s
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: "[HA-GRAFANA] Verify Grafana PVC is bound"
  shell: |
    STATUS=$(kubectl get pvc grafana-storage -n monitoring \
      -o jsonpath='{.status.phase}' 2>/dev/null || echo "NotFound")
    echo "Grafana PVC status: $STATUS"
    [ "$STATUS" = "Bound" ] && echo "✓ Grafana données persistées sur NFS" || echo "⚠ PVC non bound"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

# FIX : Vérification PVC NFS créé et bound APRÈS helm install
# FIX : Vérification PVC NFS créé et bound APRÈS helm install
- name: "[HA] Verify NFS PVC is bound after helm deploy"
  shell: |
    echo "→ Attente binding PVC NFS..."
    for i in $(seq 1 30); do
      UNBOUND=$(kubectl get pvc -n monitoring \
        --no-headers 2>/dev/null | \
        grep "nfs" | grep -v "Bound" | wc -l)
      TOTAL=$(kubectl get pvc -n monitoring \
        --no-headers 2>/dev/null | \
        grep "nfs" | wc -l)
      echo "  Attempt $i - NFS PVCs: total=$TOTAL unbound=$UNBOUND"
      if [ "$TOTAL" -gt "0" ] && [ "$UNBOUND" -eq "0" ]; then
        echo "✓ Tous les PVCs NFS sont Bound — données persistantes"
        exit 0
      fi
      sleep 5
    done
    echo "⚠ PVC non bound après 150s"
    kubectl get pvc -n monitoring
    exit 1
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
# FIX-12 : Patch Loki StatefulSet pour retirer les probes
- name: Patch Loki StatefulSet to remove probes
  shell: |
    for i in $(seq 1 20); do
      kubectl get statefulset loki -n monitoring &>/dev/null && break
      echo "  Waiting for StatefulSet loki... ($i)"
      sleep 3
    done
    kubectl patch statefulset loki -n monitoring --type=json \
      -p='[{"op":"remove","path":"/spec/template/spec/containers/0/readinessProbe"}]' \
      2>/dev/null && echo "✓ readinessProbe supprimée" || echo "readinessProbe déjà absente"
    kubectl patch statefulset loki -n monitoring --type=json \
      -p='[{"op":"remove","path":"/spec/template/spec/containers/0/livenessProbe"}]' \
      2>/dev/null && echo "✓ livenessProbe supprimée" || echo "livenessProbe déjà absente"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Wait for Loki pod to be ready
  shell: |
    for i in $(seq 1 60); do
      READY=$(kubectl get pod loki-0 -n monitoring \
        -o jsonpath='{.status.containerStatuses[0].ready}' 2>/dev/null || echo "false")
      echo "  Attempt $i - loki-0 ready=$READY"
      [ "$READY" = "true" ] && exit 0
      sleep 10
    done
    echo "ERROR: loki-0 not ready after 10min"
    exit 1
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Wait for Grafana pod to be ready
  shell: |
    for i in $(seq 1 60); do
      READY=$(kubectl get pods -n monitoring -l app.kubernetes.io/name=grafana \
        -o jsonpath='{.items[0].status.containerStatuses[?(@.name=="grafana")].ready}' \
        2>/dev/null || echo "false")
      echo "  Attempt $i - grafana ready=$READY"
      [ "$READY" = "true" ] && exit 0
      sleep 10
    done
    echo "ERROR: grafana not ready after 10min"
    exit 1
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

# =============================================================================
# PARTIE 6 : CONFIGURE DATASOURCE + STABILISATION
# =============================================================================

- name: Deploy configure-datasource script
  copy:
    dest: /tmp/configure-datasource.sh
    mode: "0755"
    content: |
      #!/bin/bash
      set -e
      export KUBECONFIG=/home/ubuntu/.kube/config

      GRAFANA_POD=$(kubectl get pods -n monitoring -l app.kubernetes.io/name=grafana \
        -o jsonpath='{.items[0].metadata.name}')
      PASS=$(kubectl get secret loki-grafana -n monitoring \
        -o jsonpath='{.data.admin-password}' | base64 -d)

      echo "→ Attente API Grafana..."
      for i in $(seq 1 40); do
        STATUS=$(kubectl exec -n monitoring $GRAFANA_POD -c grafana -- \
          curl -s -o /dev/null -w "%{http_code}" -u admin:${PASS} \
          http://localhost:3000/api/health 2>/dev/null || echo "000")
        echo "  Attempt $i - HTTP $STATUS"
        [ "$STATUS" = "200" ] && break
        sleep 5
      done

      EXISTING=$(kubectl exec -n monitoring $GRAFANA_POD -c grafana -- \
        curl -s -u admin:${PASS} \
        http://localhost:3000/api/datasources/name/Loki 2>/dev/null | \
        python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('uid','NOTFOUND'))" \
        2>/dev/null || echo "NOTFOUND")

      if [ "$EXISTING" = "loki" ]; then
        echo "✓ Datasource OK (uid=loki)"
      else
        echo "→ Création datasource via API..."
        kubectl exec -n monitoring $GRAFANA_POD -c grafana -- \
          curl -s -X DELETE -u admin:${PASS} \
          http://localhost:3000/api/datasources/name/Loki 2>/dev/null || true
        sleep 2
        kubectl exec -n monitoring $GRAFANA_POD -c grafana -- \
          curl -s -X POST -u admin:${PASS} \
          -H "Content-Type: application/json" \
          -d '{
            "uid": "loki",
            "name": "Loki",
            "type": "loki",
            "url": "http://loki.monitoring.svc.cluster.local:3100",
            "access": "proxy",
            "isDefault": true,
            "editable": true,
            "jsonData": {"maxLines": 5000, "timeout": 120, "maxConcurrentShardRequests": 6}
          }' http://localhost:3000/api/datasources
        echo ""
      fi

      HTTP=$(kubectl exec -n monitoring $GRAFANA_POD -c grafana -- \
        curl -s -o /dev/null -w "%{http_code}" -u admin:${PASS} \
        "http://localhost:3000/api/datasources/proxy/uid/loki/loki/api/v1/labels" \
        2>/dev/null || echo "000")
      echo "  Loki proxy test: HTTP $HTTP"
      [ "$HTTP" = "200" ] && echo "✓ Loki répond correctement" \
        || echo "⚠ Loki non joignable via Grafana (non bloquant)"
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Configure Loki datasource
  command: bash /tmp/configure-datasource.sh
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Patch Loki datasource settings
  shell: |
    export KUBECONFIG=/home/ubuntu/.kube/config
    GRAFANA_POD=$(kubectl get pods -n monitoring -l app.kubernetes.io/name=grafana \
      -o jsonpath='{.items[0].metadata.name}')
    PASS=$(kubectl get secret loki-grafana -n monitoring \
      -o jsonpath='{.data.admin-password}' | base64 -d)

    DS_ID=$(kubectl exec -n monitoring $GRAFANA_POD -c grafana -- \
      curl -s -u admin:${PASS} \
      http://localhost:3000/api/datasources/name/Loki 2>/dev/null | \
      python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))" \
      2>/dev/null || echo "")

    [ -z "$DS_ID" ] && echo "⚠ Datasource introuvable — skip" && exit 0

    kubectl exec -n monitoring $GRAFANA_POD -c grafana -- \
      curl -s -X PUT -u admin:${PASS} \
      -H "Content-Type: application/json" \
      -d "{
        \"id\": $DS_ID,
        \"uid\": \"loki\",
        \"name\": \"Loki\",
        \"type\": \"loki\",
        \"url\": \"http://loki.monitoring.svc.cluster.local:3100\",
        \"access\": \"proxy\",
        \"isDefault\": true,
        \"editable\": true,
        \"jsonData\": {
          \"maxLines\": 100,
          \"timeout\": 300,
          \"maxConcurrentShardRequests\": 2,
          \"httpMethod\": \"GET\"
        }
      }" http://localhost:3000/api/datasources/$DS_ID
    echo ""
    echo "✓ Datasource patchée"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  ignore_errors: true

# =============================================================================
# PARTIE 7 : PROMTAIL AUDIT
# =============================================================================

- name: Deploy Promtail ConfigMap for audit log parsing
  copy:
    dest: /tmp/promtail-audit-config.yaml
    content: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: promtail-audit-config
        namespace: monitoring
      data:
        promtail.yaml: |
          server:
            http_listen_port: 9080
            grpc_listen_port: 0
          positions:
            filename: /tmp/positions-audit.yaml
          clients:
            - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
              batchwait: 2s
              batchsize: 1048576
              timeout: 30s
              backoff_config:
                min_period: 1s
                max_period: 5m
                max_retries: 15
          scrape_configs:
            - job_name: kubernetes-audit
              static_configs:
                - targets:
                    - localhost
                  labels:
                    job: kubernetes-audit
                    host: master-01
                    __path__: /var/log/kubernetes/audit.log
              pipeline_stages:
                - json:
                    expressions:
                      verb: verb
                      stage: stage
                      user: user
                      objectRef: objectRef
                      responseStatus: responseStatus
                    on_error: keep
                - json:
                    source: user
                    expressions:
                      username: username
                    on_error: keep
                - json:
                    source: objectRef
                    expressions:
                      namespace: namespace
                      resource: resource
                    on_error: keep
                - json:
                    source: responseStatus
                    expressions:
                      statusCode: code
                    on_error: keep
                - labels:
                    verb:
                    stage:
                    username:
                    namespace:
                    resource:
                    statusCode:
                - drop:
                    source: namespace
                    value: ""
                    drop_counter_reason: cluster_scoped_audit_no_namespace
                - drop:
                    expression: '.*allowWatchBookmarks.*'
                    drop_counter_reason: watch_bookmarks
                - drop:
                    source: stage
                    value: RequestReceived
                    drop_counter_reason: audit_stage_request_received
                - drop:
                    source: stage
                    value: ResponseStarted
                    drop_counter_reason: audit_stage_response_started
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Apply Promtail Audit ConfigMap
  command: kubectl apply -f /tmp/promtail-audit-config.yaml
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Deploy Promtail Audit RBAC + DaemonSet
  copy:
    dest: /tmp/promtail-audit-daemonset.yaml
    content: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: promtail-audit
        namespace: monitoring
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: promtail-audit
      rules:
        - apiGroups: [""]
          resources: ["nodes", "services", "pods", "namespaces"]
          verbs: ["get", "list", "watch"]
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: promtail-audit
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: promtail-audit
      subjects:
        - kind: ServiceAccount
          name: promtail-audit
          namespace: monitoring
      ---
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: promtail-audit
        namespace: monitoring
        labels:
          app: promtail-audit
      spec:
        selector:
          matchLabels:
            app: promtail-audit
        template:
          metadata:
            labels:
              app: promtail-audit
          spec:
            serviceAccountName: promtail-audit
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
            nodeSelector:
              node-role.kubernetes.io/control-plane: ""
            containers:
              - name: promtail
                image: grafana/promtail:2.9.0
                args:
                  - -config.file=/etc/promtail/promtail.yaml
                volumeMounts:
                  - name: config
                    mountPath: /etc/promtail
                  - name: audit-log
                    mountPath: /var/log/kubernetes
                    readOnly: true
                  - name: positions
                    mountPath: /tmp
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    cpu: 200m
                    memory: 256Mi
            volumes:
              - name: config
                configMap:
                  name: promtail-audit-config
              - name: audit-log
                hostPath:
                  path: /var/log/kubernetes
              - name: positions
                emptyDir: {}
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Apply Promtail Audit RBAC + DaemonSet
  command: kubectl apply -f /tmp/promtail-audit-daemonset.yaml
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Wait for Promtail Audit to be ready
  shell: kubectl rollout status daemonset/promtail-audit -n monitoring --timeout=120s
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

# =============================================================================
# PARTIE 8 : PROMTAIL CLUSTER
# =============================================================================

- name: Deploy Promtail ConfigMap for ALL container logs
  copy:
    dest: /tmp/promtail-cluster-config.yaml
    content: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: promtail-cluster-config
        namespace: monitoring
      data:
        promtail.yaml: |
          server:
            http_listen_port: 9081
            grpc_listen_port: 0
          positions:
            filename: /tmp/positions-cluster.yaml
          clients:
            - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
              batchwait: 2s
              batchsize: 1048576
              timeout: 30s
              backoff_config:
                min_period: 1s
                max_period: 5m
                max_retries: 15
          scrape_configs:
            - job_name: kubernetes-cluster
              static_configs:
                - targets:
                    - localhost
                  labels:
                    job: kubernetes-cluster
                    __path__: /var/log/containers/*.log
              pipeline_stages:
                - regex:
                    source: filename
                    expression: '/var/log/containers/(?P<pod_name>[^_]+)_(?P<namespace>[^_]+)_(?P<container_name>[^-]+)-(?P<container_id>[a-f0-9]+)\.log'
                - labels:
                    namespace:
                    pod_name:
                - drop:
                    source: namespace
                    value: ""
                    drop_counter_reason: cri_filename_without_namespace
            - job_name: node-system
              static_configs:
                - targets:
                    - localhost
                  labels:
                    job: node-system
                    __path__: /var/log/syslog
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Apply Promtail Cluster ConfigMap
  command: kubectl apply -f /tmp/promtail-cluster-config.yaml
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Deploy Promtail Cluster DaemonSet + RBAC
  copy:
    dest: /tmp/promtail-cluster-daemonset.yaml
    content: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: promtail-cluster
        namespace: monitoring
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: promtail-cluster
      rules:
        - apiGroups: [""]
          resources: ["nodes", "services", "pods", "namespaces"]
          verbs: ["get", "watch", "list"]
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: promtail-cluster
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: promtail-cluster
      subjects:
        - kind: ServiceAccount
          name: promtail-cluster
          namespace: monitoring
      ---
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: promtail-cluster
        namespace: monitoring
        labels:
          app: promtail-cluster
      spec:
        selector:
          matchLabels:
            app: promtail-cluster
        updateStrategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 1
        template:
          metadata:
            labels:
              app: promtail-cluster
          spec:
            serviceAccountName: promtail-cluster
            tolerations:
              - operator: Exists
                effect: NoSchedule
              - operator: Exists
                effect: NoExecute
            containers:
              - name: promtail
                image: grafana/promtail:2.9.0
                args:
                  - -config.file=/etc/promtail/promtail.yaml
                env:
                  - name: HOSTNAME
                    valueFrom:
                      fieldRef:
                        fieldPath: spec.nodeName
                volumeMounts:
                  - name: config
                    mountPath: /etc/promtail
                  - name: varlog
                    mountPath: /var/log
                    readOnly: true
                  - name: varlibdockercontainers
                    mountPath: /var/lib/docker/containers
                    readOnly: true
                  - name: positions
                    mountPath: /tmp
                resources:
                  requests:
                    cpu: 150m
                    memory: 256Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi
            volumes:
              - name: config
                configMap:
                  name: promtail-cluster-config
              - name: varlog
                hostPath:
                  path: /var/log
              - name: varlibdockercontainers
                hostPath:
                  path: /var/lib/docker/containers
              - name: positions
                emptyDir: {}
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Apply Promtail Cluster DaemonSet
  command: kubectl apply -f /tmp/promtail-cluster-daemonset.yaml
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Wait for Promtail Cluster DaemonSet to be ready
  shell: kubectl rollout status daemonset/promtail-cluster -n monitoring --timeout=180s
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  ignore_errors: true

- name: Restart Promtail Audit for clean Loki reconnection
  shell: |
    kubectl rollout restart daemonset/promtail-audit -n monitoring
    kubectl rollout status daemonset/promtail-audit -n monitoring --timeout=120s
    echo "✓ promtail-audit redémarré"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  ignore_errors: yes

# =============================================================================
# PARTIE 9 : STABILISATION GRAFANA ↔ LOKI
# =============================================================================

- name: Wait for Loki to be fully stable
  shell: |
    for i in $(seq 1 30); do
      STATUS=$(kubectl exec -n monitoring loki-0 -- \
        wget -qO- http://localhost:3100/loki/api/v1/labels 2>/dev/null | \
        python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('status','fail'))" \
        2>/dev/null || echo "fail")
      echo "  Attempt $i - Loki status: $STATUS"
      [ "$STATUS" = "success" ] && break
      sleep 5
    done
    echo "✓ Loki stable"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  ignore_errors: true

- name: Restart Grafana for clean DNS resolution to Loki
  shell: |
    GRAFANA_DEPLOY=$(kubectl get deploy -n monitoring -l app.kubernetes.io/name=grafana \
      -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "loki-grafana")
    kubectl rollout restart deployment/$GRAFANA_DEPLOY -n monitoring
    kubectl rollout status deployment/$GRAFANA_DEPLOY -n monitoring --timeout=180s
    echo "✓ Grafana redémarré"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Wait for Grafana to be ready after restart
  shell: |
    for i in $(seq 1 40); do
      READY=$(kubectl get pods -n monitoring -l app.kubernetes.io/name=grafana \
        -o jsonpath='{.items[0].status.containerStatuses[?(@.name=="grafana")].ready}' \
        2>/dev/null || echo "false")
      echo "  Attempt $i - grafana ready=$READY"
      [ "$READY" = "true" ] && exit 0
      sleep 10
    done
    echo "ERROR: grafana not ready"
    exit 1
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

# =============================================================================
# PARTIE 10 : SCRIPTS CLI HELPER
# =============================================================================

- name: Deploy cluster-logs helper script
  copy:
    dest: /usr/local/bin/cluster-logs
    mode: "0755"
    content: |
      #!/bin/bash
      RED='\033[0;31m'
      GRN='\033[0;32m'
      YLW='\033[0;33m'
      BLU='\033[0;34m'
      CYN='\033[0;36m'
      RST='\033[0m'

      case "$1" in
        errors)
          echo -e "${RED}[ERRORS] Logs d'erreur du cluster${RST}"
          kubectl logs -n monitoring -l app=promtail-cluster --tail=200 2>/dev/null | \
            grep -i "error" | tail -20
          ;;
        loki-check)
          echo -e "${CYN}[LOKI CHECK] Vérification connectivité Loki${RST}"
          echo -e "${YLW}→ Labels Loki :${RST}"
          kubectl exec -n monitoring loki-0 -- \
            wget -qO- http://localhost:3100/loki/api/v1/labels 2>/dev/null
          echo ""
          echo -e "${YLW}→ PVC NFS status :${RST}"
          kubectl get pvc -n monitoring
          echo ""
          echo -e "${YLW}→ Pods monitoring :${RST}"
          kubectl get pods -n monitoring -o wide
          ;;
        status)
          echo -e "${CYN}[STATUS] DaemonSets Promtail${RST}"
          kubectl get daemonset -n monitoring
          echo ""
          kubectl get pods -n monitoring -o wide
          ;;
        help|*)
          echo -e "${CYN}Usage : cluster-logs <commande>${RST}"
          echo -e "  ${RED}errors${RST}       Logs d'erreur"
          echo -e "  ${CYN}loki-check${RST}   Vérification connectivité + PVC NFS"
          echo -e "  ${CYN}status${RST}       État des DaemonSets"
          ;;
      esac
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

# =============================================================================
# PARTIE 11 : RÉSUMÉ FINAL
# =============================================================================

- name: Get Grafana NodePort
  shell: kubectl get svc loki-grafana -n monitoring -o jsonpath='{.spec.ports[0].nodePort}'
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  register: grafana_port
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  ignore_errors: true

- name: Verify all monitoring pods are running
  shell: kubectl get pods -n monitoring -o wide
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  register: monitoring_pods
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Verify PVC NFS status
  shell: kubectl get pvc -n monitoring
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  register: pvc_status
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  ignore_errors: true

- name: Check Loki data ingestion
  shell: |
    kubectl exec -n monitoring loki-0 -- \
      wget -qO- http://localhost:3100/loki/api/v1/labels 2>/dev/null \
      || echo '{"status":"unknown"}'
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  register: loki_labels
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  ignore_errors: true

- name: Print access summary
  debug:
    msg: |
      ╔══════════════════════════════════════════════════════════════════════════════╗
      ║    AUDIT LOGGING + CLUSTER MONITORING + HA NFS — INSTALLATION TERMINÉE     ║
      ╠══════════════════════════════════════════════════════════════════════════════╣

      📦 PVC NFS STATUS :
      {{ pvc_status.stdout | default('N/A') }}

      📊 PODS MONITORING :
      {{ monitoring_pods.stdout }}

      📊 LOKI DATA : {{ loki_labels.stdout | default('unknown') }}

      📁 AUDIT LOGS
         Path : /var/log/kubernetes/audit.log
         CLI  : audit-log watch / errors / stats / secrets / node <nom>

      🌍 CLUSTER LOGS
         CLI  : cluster-logs loki-check / errors / status

      📊 GRAFANA
         URL      : http://{{ hostvars[groups['master'][0]]['ansible_host'] }}:{{ grafana_port.stdout | default('32000') }}
         Login    : admin
         Password : {{ grafana_admin_password | default('Admin1234!') }}

      🔒 HA NFS — COMPORTEMENT EN CAS DE PANNE WORKER-03
         ✅ loki-0 replanifié sur worker-02 ou worker-04
         ✅ PVC NFS remonté depuis master-01:/data/loki-nfs
         ✅ DONNÉES INTACTES après panne
         ✅ Promtail reconnecte automatiquement

      ╚══════════════════════════════════════════════════════════════════════════════╝
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

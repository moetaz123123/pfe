---
# =============================================================================
# PARTIE 1 : CONFIGURATION DE L'AUDIT LOGGING KUBERNETES (kube-apiserver)
# =============================================================================

- name: Create audit log directory
  file:
    path: /var/log/kubernetes
    state: directory
    mode: "0755"
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Render audit policy to master
  template:
    src: audit-policy.yaml
    dest: /tmp/audit-policy.yaml
    mode: "0644"
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Create audit policy directory
  file:
    path: /etc/kubernetes/audit
    state: directory
    mode: "0755"
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Copy audit policy into Kubernetes config dir
  command: cp /tmp/audit-policy.yaml /etc/kubernetes/audit/policy.yaml
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Backup kube-apiserver manifest
  command: >
    cp /etc/kubernetes/manifests/kube-apiserver.yaml
    /etc/kubernetes/kube-apiserver.yaml.bak
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  ignore_errors: yes

- name: Patch kube-apiserver manifest with audit flags and volumes
  shell: |
    python3 - <<'EOF'
    import yaml
    path = "/etc/kubernetes/manifests/kube-apiserver.yaml"
    with open(path) as f:
        manifest = yaml.safe_load(f)
    containers = manifest["spec"]["containers"]
    for container in containers:
        if container["name"] == "kube-apiserver":
            cmd = container.get("command", [])
            audit_flags = [
                "--audit-policy-file=/etc/kubernetes/audit/policy.yaml",
                "--audit-log-path=/var/log/kubernetes/audit.log",
                "--audit-log-maxage=30",
                "--audit-log-maxbackup=10",
                "--audit-log-maxsize=100"
            ]
            for flag in audit_flags:
                key = flag.split("=")[0]
                cmd = [c for c in cmd if not c.startswith(key)]
                cmd.append(flag)
            container["command"] = cmd
            mounts = container.get("volumeMounts", [])
            mount_names = [m["name"] for m in mounts]
            if "audit-policy" not in mount_names:
                mounts.append({
                    "name": "audit-policy",
                    "mountPath": "/etc/kubernetes/audit",
                    "readOnly": True
                })
            if "audit-log" not in mount_names:
                mounts.append({
                    "name": "audit-log",
                    "mountPath": "/var/log/kubernetes",
                    "readOnly": False
                })
            container["volumeMounts"] = mounts
    volumes = manifest["spec"].get("volumes", [])
    volume_names = [v["name"] for v in volumes]
    if "audit-policy" not in volume_names:
        volumes.append({
            "name": "audit-policy",
            "hostPath": {
                "path": "/etc/kubernetes/audit",
                "type": "DirectoryOrCreate"
            }
        })
    if "audit-log" not in volume_names:
        volumes.append({
            "name": "audit-log",
            "hostPath": {
                "path": "/var/log/kubernetes",
                "type": "DirectoryOrCreate"
            }
        })
    manifest["spec"]["volumes"] = volumes
    with open(path, "w") as f:
        yaml.dump(manifest, f, default_flow_style=False, allow_unicode=True)
    print("OK")
    EOF
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Wait for kube-apiserver to come back up after manifest change
  wait_for:
    host: "{{ hostvars[groups['master'][0]]['ansible_host'] }}"
    port: 6443
    delay: 15
    timeout: 120
    state: started
  delegate_to: localhost
  run_once: true

- name: Verify API server is healthy before continuing
  command: kubectl cluster-info
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  retries: 5
  delay: 10
  register: result
  until: result.rc == 0

# =============================================================================
# PARTIE 2 : INSTALLATION JQ + SQLITE3 + SCRIPT audit-log
# =============================================================================

- name: Install jq and sqlite3
  apt:
    name:
      - jq
      - sqlite3
    state: present
    update_cache: yes
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Deploy audit log helper script
  copy:
    dest: /usr/local/bin/audit-log
    mode: "0755"
    content: |
      #!/bin/bash
      LOG=/var/log/kubernetes/audit.log

      RED='\033[0;31m'
      GRN='\033[0;32m'
      YLW='\033[0;33m'
      BLU='\033[0;34m'
      CYN='\033[0;36m'
      RST='\033[0m'

      header() {
        echo -e "${CYN}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━${RST}"
        printf "${CYN}%-30s %-8s %-14s %-20s %-6s${RST}\n" "USER" "VERB" "RESOURCE" "NAMESPACE" "CODE"
        echo -e "${CYN}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━${RST}"
      }

      colorize() {
        while IFS=$'\t' read -r user verb resource ns code; do
          if [[ "$code" == "403" ]]; then
            color=$RED
          elif [[ "$code" == "200" ]]; then
            color=$GRN
          else
            color=$YLW
          fi
          printf "${color}%-30s %-8s %-14s %-20s %-6s${RST}\n" "$user" "$verb" "$resource" "$ns" "$code"
        done
      }

      case "$1" in
        watch)
          echo -e "${BLU}[LIVE] Audit log en temps réel (Ctrl+C pour quitter)${RST}"
          header
          tail -f $LOG | jq -r --unbuffered \
            '[.user.username, .verb, (.objectRef.resource // "-"), (.objectRef.namespace // "-"), (.responseStatus.code | tostring)] | @tsv' \
            2>/dev/null | colorize
          ;;
        errors)
          echo -e "${RED}[ERRORS] Requêtes refusées (403)${RST}"
          header
          cat $LOG | jq -r 'select(.responseStatus.code == 403) |
            [.user.username, .verb, (.objectRef.resource // "-"), (.objectRef.namespace // "-"), (.responseStatus.code | tostring)] | @tsv' \
            2>/dev/null | colorize
          ;;
        secrets)
          echo -e "${YLW}[SECRETS] Accès aux secrets${RST}"
          header
          cat $LOG | jq -r 'select(.objectRef.resource == "secrets") |
            [.user.username, .verb, (.objectRef.name // "-"), (.objectRef.namespace // "-"), (.responseStatus.code | tostring)] | @tsv' \
            2>/dev/null | colorize
          ;;
        deletes)
          echo -e "${RED}[DELETES] Toutes les suppressions${RST}"
          header
          cat $LOG | jq -r 'select(.verb == "delete") |
            [.user.username, .verb, (.objectRef.resource // "-"), (.objectRef.namespace // "-"), (.responseStatus.code | tostring)] | @tsv' \
            2>/dev/null | colorize
          ;;
        node)
          NODE="${2:-worker-03}"
          echo -e "${BLU}[NODE] Activité du nœud : $NODE${RST}"
          header
          cat $LOG | jq -r --arg n "system:node:$NODE" 'select(.user.username == $n) |
            [.user.username, .verb, (.objectRef.resource // "-"), (.objectRef.namespace // "-"), (.responseStatus.code | tostring)] | @tsv' \
            2>/dev/null | colorize
          ;;
        stats)
          echo -e "${CYN}[STATS] Résumé de l'audit log${RST}"
          echo ""
          echo -e "${YLW}→ Total événements :${RST}"
          wc -l < $LOG
          echo -e "\n${YLW}→ Requêtes par code HTTP :${RST}"
          cat $LOG | jq -r '.responseStatus.code' 2>/dev/null | sort | uniq -c | sort -rn | \
            awk '{if($2=="200") c="\033[0;32m"; else if($2=="403") c="\033[0;31m"; else c="\033[0;33m"; printf "%s  %6d  %s\033[0m\n", c, $1, $2}'
          echo -e "\n${YLW}→ Top 5 utilisateurs actifs :${RST}"
          cat $LOG | jq -r '.user.username' 2>/dev/null | sort | uniq -c | sort -rn | head -5 | \
            awk '{printf "  %6d  %s\n", $1, $2}'
          echo -e "\n${YLW}→ Top 5 ressources accédées :${RST}"
          cat $LOG | jq -r '.objectRef.resource // "-"' 2>/dev/null | sort | uniq -c | sort -rn | head -5 | \
            awk '{printf "  %6d  %s\n", $1, $2}'
          echo -e "\n${YLW}→ Namespaces les plus ciblés :${RST}"
          cat $LOG | jq -r '.objectRef.namespace // "-"' 2>/dev/null | grep -v '^-$' | sort | uniq -c | sort -rn | head -5 | \
            awk '{printf "  %6d  %s\n", $1, $2}'
          ;;
        help|*)
          echo -e "${CYN}Usage : audit-log <commande>${RST}"
          echo ""
          echo -e "  ${GRN}watch${RST}          Live stream de tous les événements"
          echo -e "  ${RED}errors${RST}         Affiche uniquement les refus (403)"
          echo -e "  ${YLW}secrets${RST}        Accès aux secrets uniquement"
          echo -e "  ${RED}deletes${RST}        Toutes les suppressions"
          echo -e "  ${BLU}node <nom>${RST}     Activité d'un nœud (ex: audit-log node worker-02)"
          echo -e "  ${CYN}stats${RST}          Résumé statistique de l'audit log"
          echo ""
          ;;
      esac
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

# =============================================================================
# PARTIE 3 : HA-01 — NFS SERVER SUR MASTER-01
# =============================================================================

- name: "[HA-01] Install NFS server on master-01"
  apt:
    name:
      - nfs-kernel-server
      - nfs-common
    state: present
    update_cache: yes
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: "[HA-01] Create NFS export directory"
  file:
    path: /data/loki-nfs
    state: directory
    mode: "0777"
    owner: nobody
    group: nogroup
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: "[HA-01] Configure NFS export"
  lineinfile:
    path: /etc/exports
    line: "/data/loki-nfs 10.0.0.0/8(rw,sync,no_subtree_check,no_root_squash)"
    create: yes
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: "[HA-01] Apply NFS exports and start service"
  shell: |
    exportfs -ra
    systemctl enable nfs-kernel-server
    systemctl restart nfs-kernel-server
    echo "✓ NFS exports actifs :"
    exportfs -v
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: "[HA-01] Install NFS client on all nodes"
  apt:
    name: nfs-common
    state: present
    update_cache: yes
  when: inventory_hostname != groups['master'][0]
# =============================================================================
# HA-02 : STORAGECLASS NFS DYNAMIQUE
# =============================================================================

- name: "[HA-02] Add NFS provisioner Helm repo"
  shell: |
    helm repo add nfs-subdir-external-provisioner \
      https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner/
    helm repo update
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: "[HA-02] Deploy NFS subdir provisioner"
  shell: |
    MASTER_IP="{{ hostvars[groups['master'][0]]['ansible_host'] }}"
    helm upgrade --install nfs-provisioner \
      nfs-subdir-external-provisioner/nfs-subdir-external-provisioner \
      --namespace nfs-provisioner \
      --create-namespace \
      --set nfs.server=${MASTER_IP} \
      --set nfs.path=/data/loki-nfs \
      --set storageClass.name=nfs \
      --set storageClass.defaultClass=false \
      --set storageClass.reclaimPolicy=Retain \
      --timeout 5m
    echo "✓ StorageClass 'nfs' créée"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: "[HA-02] Wait for NFS provisioner ready"
  shell: |
    kubectl rollout status deployment/nfs-provisioner-nfs-subdir-external-provisioner \
      -n nfs-provisioner --timeout=120s
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

# =============================================================================
# PARTIE 4 : PREPARATION HELM LOKI — NETTOYAGE + CONFIGMAPS
# =============================================================================

- name: Add Grafana Helm repository
  shell: |
    helm repo add grafana https://grafana.github.io/helm-charts
    helm repo update
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Create monitoring namespace
  shell: kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

# FIX-11 : Déverrouillage Helm + suppression PVC emptyDir existant
- name: Unlock Helm release and clean existing emptyDir PVC
  shell: |
    STATUS=$(helm status loki -n monitoring --output json 2>/dev/null \
      | python3 -c "import json,sys; print(json.load(sys.stdin)['info']['status'])" 2>/dev/null \
      || echo "notfound")
    echo "Helm loki status: [$STATUS]"

    # Suppression StatefulSet existant (cascade=orphan pour garder les pods le temps du nettoyage)
    kubectl delete statefulset loki -n monitoring \
      --cascade=orphan --ignore-not-found=true
    kubectl delete pod loki-0 -n monitoring \
      --ignore-not-found=true --grace-period=0
    echo "StatefulSet + pod loki-0 supprimés"

    # Suppression PVC existant (emptyDir ou local-path)
    PVC_EXISTS=$(kubectl get pvc -n monitoring --no-headers 2>/dev/null | grep loki | wc -l)
    if [ "$PVC_EXISTS" -gt "0" ]; then
      kubectl delete pvc -n monitoring -l app=loki --ignore-not-found=true
      kubectl delete pvc storage-loki-0 -n monitoring --ignore-not-found=true
      echo "PVC existant supprimé"
    else
      echo "Aucun PVC existant — OK"
    fi

    case "$STATUS" in
      pending-install|failed)
        kubectl delete secret -n monitoring \
          -l "name=loki,owner=helm" --ignore-not-found=true
        echo "Secrets Helm nettoyés"
        ;;
      pending-upgrade|pending-rollback)
        helm rollback loki -n monitoring 2>/dev/null || \
          kubectl delete secret -n monitoring \
            -l "name=loki,owner=helm" --ignore-not-found=true
        echo "Rollback effectué"
        ;;
    esac

    echo "✓ Nettoyage terminé"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Create Grafana datasource provisioning ConfigMap
  shell: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: loki-datasource-provisioning
      namespace: monitoring
      labels:
        app: loki-grafana
    data:
      loki-datasource.yaml: |
        apiVersion: 1
        datasources:
          - name: Loki
            type: loki
            uid: loki
            url: http://loki.monitoring.svc.cluster.local:3100
            access: proxy
            isDefault: true
            editable: true
            jsonData:
              maxLines: 5000
              timeout: 120
              maxConcurrentShardRequests: 6
    EOF
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Create Grafana dashboard provisioning ConfigMap
  shell: |
    kubectl apply -f - <<'ENDOFYAML'
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: grafana-dashboard-provisioning
      namespace: monitoring
    data:
      dashboards.yaml: |
        apiVersion: 1
        providers:
          - name: kubernetes-monitoring
            orgId: 1
            folder: Kubernetes
            type: file
            disableDeletion: true
            updateIntervalSeconds: 30
            allowUiUpdates: false
            options:
              path: /var/lib/grafana/dashboards
    ENDOFYAML
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Create Grafana audit dashboard ConfigMap
  shell: |
    kubectl apply -f - <<'ENDOFYAML'
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: grafana-dashboard-audit
      namespace: monitoring
      labels:
        grafana_dashboard: "1"
    data:
      kubernetes-audit.json: |
        {% raw %}{
          "uid": "kubernetes-audit",
          "title": "Kubernetes Audit Log",
          "timezone": "browser",
          "refresh": "30s",
          "time": {"from": "now-6h", "to": "now"},
          "templating": {
            "list": [
              {
                "name": "datasource_loki",
                "type": "datasource",
                "pluginId": "loki",
                "current": {"value": "Loki", "text": "Loki"}
              },
              {
                "name": "namespace",
                "type": "query",
                "datasource": {"type": "loki", "uid": "${datasource_loki}"},
                "query": "label_values({job=\"kubernetes-audit\", namespace!=\"\"}, namespace)",
                "current": {"value": "$__all", "text": "All"},
                "includeAll": true,
                "allValue": ".*"
              }
            ]
          },
          "panels": [
            {
              "id": 1, "type": "stat", "title": "Total Evenements (1h)",
              "gridPos": {"x": 0, "y": 0, "w": 6, "h": 4},
              "datasource": {"type": "loki", "uid": "loki"},
              "targets": [{"expr": "sum(count_over_time({job=\"kubernetes-audit\", namespace!=\"\", namespace=~\"$namespace\"}[1h]))", "refId": "A"}],
              "fieldConfig": {"defaults": {"color": {"mode": "fixed", "fixedColor": "green"}, "noValue": "0"}}
            },
            {
              "id": 2, "type": "stat", "title": "Requetes Refusees 403 (1h)",
              "gridPos": {"x": 6, "y": 0, "w": 6, "h": 4},
              "datasource": {"type": "loki", "uid": "loki"},
              "targets": [{"expr": "sum(count_over_time({job=\"kubernetes-audit\", namespace!=\"\", namespace=~\"$namespace\", statusCode=\"403\"}[1h]))", "refId": "A"}],
              "fieldConfig": {"defaults": {"color": {"mode": "fixed", "fixedColor": "red"}, "noValue": "0"}}
            },
            {
              "id": 3, "type": "stat", "title": "Acces Secrets (1h)",
              "gridPos": {"x": 12, "y": 0, "w": 6, "h": 4},
              "datasource": {"type": "loki", "uid": "loki"},
              "targets": [{"expr": "sum(count_over_time({job=\"kubernetes-audit\", namespace!=\"\", namespace=~\"$namespace\", resource=\"secrets\"}[1h]))", "refId": "A"}],
              "fieldConfig": {"defaults": {"noValue": "0"}}
            },
            {
              "id": 4, "type": "stat", "title": "Suppressions (1h)",
              "gridPos": {"x": 18, "y": 0, "w": 6, "h": 4},
              "datasource": {"type": "loki", "uid": "loki"},
              "targets": [{"expr": "sum(count_over_time({job=\"kubernetes-audit\", namespace!=\"\", namespace=~\"$namespace\", verb=\"delete\"}[1h]))", "refId": "A"}],
              "fieldConfig": {"defaults": {"noValue": "0"}}
            },
            {
              "id": 5, "type": "timeseries", "title": "Requetes par Code HTTP (trend)",
              "gridPos": {"x": 0, "y": 4, "w": 12, "h": 6},
              "datasource": {"type": "loki", "uid": "loki"},
              "targets": [{"expr": "sum by (statusCode) (rate({job=\"kubernetes-audit\", namespace!=\"\", namespace=~\"$namespace\"}[5m]))", "legendFormat": "HTTP {{statusCode}}"}]
            },
            {
              "id": 6, "type": "barchart", "title": "Top 10 Utilisateurs",
              "gridPos": {"x": 12, "y": 4, "w": 12, "h": 6},
              "datasource": {"type": "loki", "uid": "loki"},
              "targets": [{"expr": "topk(10, sum by (username) (count_over_time({job=\"kubernetes-audit\", namespace!=\"\", namespace=~\"$namespace\"}[1h])))", "legendFormat": "{{username}}"}]
            },
            {
              "id": 7, "type": "piechart", "title": "Logs par Namespace",
              "gridPos": {"x": 0, "y": 10, "w": 12, "h": 8},
              "datasource": {"type": "loki", "uid": "loki"},
              "targets": [{"expr": "sum by (namespace) (count_over_time({job=\"kubernetes-audit\", namespace=~\".+\"}[1h]))", "legendFormat": "{{namespace}}"}],
              "options": {"pieType": "donut", "legend": {"displayMode": "table", "placement": "right", "values": ["percent", "value"]}}
            },
            {
              "id": 8, "type": "piechart", "title": "Distribution des Verbes",
              "gridPos": {"x": 12, "y": 10, "w": 12, "h": 8},
              "datasource": {"type": "loki", "uid": "loki"},
              "targets": [{"expr": "sum by (verb) (count_over_time({job=\"kubernetes-audit\", namespace!=\"\", namespace=~\"$namespace\"}[1h]))", "legendFormat": "{{verb}}"}],
              "options": {"pieType": "donut", "legend": {"displayMode": "table", "placement": "right", "values": ["percent", "value"]}}
            },
            {
              "id": 9, "type": "barchart", "title": "Ressources les Plus Accedees",
              "gridPos": {"x": 0, "y": 18, "w": 12, "h": 6},
              "datasource": {"type": "loki", "uid": "loki"},
              "targets": [{"expr": "topk(10, sum by (resource) (count_over_time({job=\"kubernetes-audit\", namespace!=\"\", namespace=~\"$namespace\"}[1h])))", "legendFormat": "{{resource}}"}]
            },
            {
              "id": 10, "type": "barchart", "title": "Namespaces les Plus Actifs",
              "gridPos": {"x": 12, "y": 18, "w": 12, "h": 6},
              "datasource": {"type": "loki", "uid": "loki"},
              "targets": [{"expr": "topk(10, sum by (namespace) (count_over_time({job=\"kubernetes-audit\", namespace=~\".+\"}[1h])))", "legendFormat": "{{namespace}}"}]
            },
            {
              "id": 11, "type": "logs", "title": "Logs Refuses en Direct (403)",
              "gridPos": {"x": 0, "y": 24, "w": 24, "h": 6},
              "datasource": {"type": "loki", "uid": "loki"},
              "targets": [{"expr": "{job=\"kubernetes-audit\", namespace!=\"\", namespace=~\"$namespace\", statusCode=\"403\"}", "refId": "A"}]
            },
            {
              "id": 12, "type": "logs", "title": "Acces aux Secrets",
              "gridPos": {"x": 0, "y": 30, "w": 24, "h": 6},
              "datasource": {"type": "loki", "uid": "loki"},
              "targets": [{"expr": "{job=\"kubernetes-audit\", namespace!=\"\", namespace=~\"$namespace\", resource=\"secrets\"}", "refId": "A"}]
            },
            {
              "id": 13, "type": "logs", "title": "Evenements de Suppression",
              "gridPos": {"x": 0, "y": 36, "w": 24, "h": 6},
              "datasource": {"type": "loki", "uid": "loki"},
              "targets": [{"expr": "{job=\"kubernetes-audit\", namespace!=\"\", namespace=~\"$namespace\", verb=\"delete\"}", "refId": "A"}]
            },
            {
              "id": 14, "type": "logs", "title": "Acces Pod Exec / Attach / Port-forward",
              "gridPos": {"x": 0, "y": 42, "w": 24, "h": 6},
              "datasource": {"type": "loki", "uid": "loki"},

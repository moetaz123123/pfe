---
# ============================================================
# NAMESPACE
# ============================================================
- name: Create app namespace
  command: kubectl get namespace app
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: ns_check
  failed_when: false
  changed_when: false

- name: Apply app namespace
  command: kubectl create namespace app
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  when: ns_check.rc != 0

# ============================================================
# INSTALL INGRESS CONTROLLER
# ============================================================
- name: Install NGINX Ingress Controller
  command: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.8.2/deploy/static/provider/baremetal/deploy.yaml
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Wait for ingress-nginx namespace
  command: kubectl get ns ingress-nginx
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  register: ns_ing
  until: ns_ing.rc == 0
  retries: 20
  delay: 5
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

# ============================================================
# HAUTE DISPONIBILITE — ingress-nginx controller
# ============================================================

- name: Scale ingress-nginx controller to 2 replicas
  command: kubectl scale deployment ingress-nginx-controller -n ingress-nginx --replicas=2
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Apply anti-affinity rule (force pods on different nodes)
  command: >
    kubectl patch deployment ingress-nginx-controller -n ingress-nginx --patch
    '{
      "spec": {
        "template": {
          "spec": {
            "affinity": {
              "podAntiAffinity": {
                "requiredDuringSchedulingIgnoredDuringExecution": [
                  {
                    "labelSelector": {
                      "matchExpressions": [
                        {
                          "key": "app.kubernetes.io/name",
                          "operator": "In",
                          "values": ["ingress-nginx"]
                        }
                      ]
                    },
                    "topologyKey": "kubernetes.io/hostname"
                  }
                ]
              }
            }
          }
        }
      }
    }'
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Reduce failover time to 30s (default is 300s)
  command: >
    kubectl patch deployment ingress-nginx-controller -n ingress-nginx --patch
    '{
      "spec": {
        "template": {
          "spec": {
            "tolerations": [
              {
                "key": "node.kubernetes.io/not-ready",
                "operator": "Exists",
                "effect": "NoExecute",
                "tolerationSeconds": 30
              },
              {
                "key": "node.kubernetes.io/unreachable",
                "operator": "Exists",
                "effect": "NoExecute",
                "tolerationSeconds": 30
              }
            ]
          }
        }
      }
    }'
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Wait for ingress-nginx HA pods to be ready
  command: >
    kubectl wait --for=condition=Ready pod
    -l app.kubernetes.io/name=ingress-nginx,app.kubernetes.io/component=controller
    -n ingress-nginx
    --timeout=300s
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  retries: 3
  delay: 30
  register: ingress_ha_wait
  until: ingress_ha_wait.rc == 0
  ignore_errors: yes

- name: Verify ingress-nginx pods are on different nodes
  command: >
    kubectl get pods -n ingress-nginx
    -l app.kubernetes.io/name=ingress-nginx
    -o wide
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: ingress_pods_info
  changed_when: false

- name: Show ingress HA pod distribution
  debug:
    msg:
      - "📦 Ingress pods distribution:"
      - "{{ ingress_pods_info.stdout_lines }}"
  run_once: true

# ============================================================
# MANIFESTS — écriture sur le master
# ============================================================

- name: Write nginx Deployment manifest
  copy:
    dest: /tmp/nginx-deployment.yaml
    content: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: nginx-app
        namespace: app
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: nginx-app
        template:
          metadata:
            labels:
              app: nginx-app
          spec:
            containers:
            - name: nginx
              image: nginx:latest
              ports:
              - containerPort: 80
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Write nginx Service manifest
  copy:
    dest: /tmp/nginx-service.yaml
    content: |
      apiVersion: v1
      kind: Service
      metadata:
        name: nginx-service
        namespace: app
      spec:
        selector:
          app: nginx-app
        ports:
        - port: 80
          targetPort: 80
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Write nginx Ingress manifest
  copy:
    dest: /tmp/nginx-ingress.yaml
    content: |
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: nginx-ingress
        namespace: app
        annotations:
          nginx.ingress.kubernetes.io/ssl-redirect: "true"
          nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      spec:
        ingressClassName: nginx
        tls:
        - hosts:
          - nginx.local
          secretName: nginx-tls-secret
        rules:
        - host: nginx.local
          http:
            paths:
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: nginx-service
                  port:
                    number: 80
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

# ============================================================
# APPLY MANIFESTS
# ============================================================

- name: Apply nginx Deployment
  command: kubectl apply -f /tmp/nginx-deployment.yaml
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Apply nginx Service
  command: kubectl apply -f /tmp/nginx-service.yaml
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

# ============================================================
# TLS CERTIFICATE
# ============================================================

- name: Check if TLS secret already exists
  command: kubectl get secret nginx-tls-secret -n app
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: tls_secret_check
  failed_when: false
  changed_when: false

- name: Generate self-signed TLS certificate
  command: >
    openssl req -x509 -nodes -days 365
    -newkey rsa:2048
    -keyout /tmp/tls.key
    -out /tmp/tls.crt
    -subj "/CN=nginx.local/O=nginx.local"
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  when: tls_secret_check.rc != 0

- name: Create TLS secret
  command: >
    kubectl create secret tls nginx-tls-secret
    --cert=/tmp/tls.crt
    --key=/tmp/tls.key
    --namespace app
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  when: tls_secret_check.rc != 0

# ============================================================
# FIX CONFLIT INGRESS — vérification préventive
# ============================================================

- name: Find all Ingress using host nginx.local across all namespaces
  command: >
    kubectl get ingress -A
    -o jsonpath='{range .items[?(@.spec.rules[0].host=="nginx.local")]}{.metadata.namespace}/{.metadata.name}{"\n"}{end}'
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: conflicting_ingresses
  changed_when: false
  failed_when: false

- name: Show conflicting Ingresses found
  debug:
    msg: "Ingress en conflit détectés : {{ conflicting_ingresses.stdout_lines }}"
  run_once: true
  when: conflicting_ingresses.stdout != ""

- name: Delete conflicting Ingress in app-ns namespace
  command: kubectl delete ingress scaling-app-ingress -n app-ns --ignore-not-found=true
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  when: >
    conflicting_ingresses.stdout is search('app-ns/')

- name: Delete any other conflicting Ingress in app namespace
  command: kubectl delete ingress nginx-ingress -n app --ignore-not-found=true
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  when: >
    conflicting_ingresses.stdout is search('app/nginx-ingress')

# ============================================================
# APPLY INGRESS
# ============================================================

- name: Apply nginx Ingress
  command: kubectl apply -f /tmp/nginx-ingress.yaml
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

# ============================================================
# WAIT FOR PODS
# ============================================================

- name: Wait for nginx pods to be ready
  command: >
    kubectl wait --for=condition=Ready pod
    -l app=nginx-app -n app
    --timeout=120s
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  retries: 3
  delay: 20
  register: nginx_wait
  until: nginx_wait.rc == 0
  ignore_errors: yes

# ============================================================
# WAIT INGRESS SERVICE
# ============================================================

- name: Wait ingress service
  command: kubectl get svc ingress-nginx-controller -n ingress-nginx
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  register: ingress_svc
  until: ingress_svc.rc == 0
  retries: 20
  delay: 10
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

# ============================================================
# OUTPUT
# ============================================================

- name: Get Ingress HTTPS NodePort
  command: >
    kubectl get svc ingress-nginx-controller
    -n ingress-nginx
    -o jsonpath='{.spec.ports[?(@.port==443)].nodePort}'
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  register: ingress_https_port
  run_once: true
  changed_when: false

- name: Show access info
  debug:
    msg:
      - "✅ App deployed successfully"
      - "👉 Add to /etc/hosts: {{ hostvars[groups['master'][0]]['ansible_host'] }} nginx.local"
      - "🌐 Access via: https://nginx.local:{{ ingress_https_port.stdout }}"
      - "🔒 TLS: self-signed certificate (use -k with curl)"
  run_once: true

- name: STOP AFTER PHASE 5
  debug:
    msg:
      - "🛑 Phase 5 completed successfully"
      - "🚀 Cluster + App + Ingress + TLS + HA READY"
  run_once: true

- meta: end_play


---
- name: Install kube-bench
  get_url:
    url: https://github.com/aquasecurity/kube-bench/releases/download/v0.6.11/kube-bench_0.6.11_linux_amd64.tar.gz
    dest: /tmp/kube-bench.tar.gz
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  ignore_errors: yes

- name: Extract kube-bench binary
  unarchive:
    src: /tmp/kube-bench.tar.gz
    dest: /usr/local/bin/
    remote_src: yes
    creates: /usr/local/bin/kube-bench
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  ignore_errors: yes

# ── FIX : télécharger les fichiers de config kube-bench ──────────────────────
# L'erreur "config file is missing 'version_mapping' section" vient du fait
# que /etc/kube-bench/cfg/ est vide ou absent.
# On télécharge le repo complet pour récupérer le dossier cfg/
- name: Ensure kube-bench config directory exists
  file:
    path: /etc/kube-bench
    state: directory
    mode: "0755"
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Download kube-bench config files
  get_url:
    url: https://github.com/aquasecurity/kube-bench/releases/download/v0.6.11/kube-bench_0.6.11_linux_amd64.tar.gz
    dest: /tmp/kube-bench-cfg.tar.gz
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  ignore_errors: yes

- name: Extract kube-bench cfg folder
  shell: |
    cd /tmp
    tar -xzf /tmp/kube-bench.tar.gz
    cp -r /tmp/cfg /etc/kube-bench/
  args:
    creates: /etc/kube-bench/cfg/config.yaml
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  ignore_errors: yes

# ── Run kube-bench avec auto-détection version ────────────────────────────────
- name: Run kube-bench (auto-detect benchmark version)
  shell: /usr/local/bin/kube-bench run --config-dir /etc/kube-bench/cfg 2>&1 || true
  register: kube_bench_output
  changed_when: false
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Show kube-bench summary
  debug:
    msg: "{{ kube_bench_output.stdout_lines[-20:] }}"
  run_once: true

- name: Save kube-bench report
  copy:
    content: "{{ kube_bench_output.stdout | default('kube-bench produced no output') }}"
    dest: "/var/log/kube-bench-report-{{ ansible_date_time.date }}.log"
    mode: "0644"
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  ignore_errors: yes

- name: Show kube-bench report path
  debug:
    msg: "📋 Rapport sauvegardé → /var/log/kube-bench-report-{{ ansible_date_time.date }}.log"
  run_once: true

                    <div class="access-title">
                      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#a0aec0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/></svg>
                      DefectDojo · Trivy
                    </div>
                    <div class="access-row">
                      <span class="alabel">URL</span>
                      <span class="avalue url">http://{{ deployment_info.cluster_master }}:8080</span>
                    </div>
                    <div class="access-row">
                      <span class="alabel">Port-forward</span>
                      <span class="avalue small">kubectl port-forward svc/defectdojo-django 8080:80 -n defectdojo --address 0.0.0.0</span>
                    </div>
                  </div>
                  <div class="access-box dark">
                    <div class="access-title">
                      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#a0aec0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>
                      Falco Sidekick UI
                    </div>
                    <div class="access-row">
                      <span class="alabel">URL</span>
                      <span class="avalue url">http://{{ deployment_info.cluster_master }}:{{ falcosidekick_ui_nodeport | default(30802) }}/events</span>
                    </div>
                    <div class="access-row">
                      <span class="alabel">Port-forward (optionnel)</span>
                      <span class="avalue small">kubectl -n falco port-forward --address 0.0.0.0 svc/falco-falcosidekick-ui 2802:2802</span>
                    </div>
                  </div>
                </div>
                <table class="ret-table">
                  <tr><th>Outil</th><th>Rapport</th><th>Statut</th></tr>
                  <tr>
                    <td><strong>Kube-Hunter</strong></td>
                    <td><span class="cmd-code">/var/log/kube-hunter-report-{{ ansible_date_time.date }}.log</span></td>
                    <td><span class="badge-green">&#10003; Généré</span></td>
                  </tr>
                  <tr>
                    <td><strong>Kube-Bench</strong></td>
                    <td><span class="cmd-code">/var/log/kube-bench-report-{{ ansible_date_time.date }}.log</span></td>
                    <td><span class="badge-green">&#10003; Généré</span></td>
                  </tr>
                </table>
              </div>
            </div>

            <div class="section">
              <div class="section-header orange">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#c05621" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                Visibilité &amp; Traçabilité Complète
              </div>
              <div class="section-body">
                <ul class="checklist">
                  <li><span class="icon">&#10003;</span><span><strong>100% du trafic API</strong> — Chaque appel au cluster est loggé</span></li>
                  <li><span class="icon">&#10003;</span><span><strong>Logs d'applications</strong> — stdout/stderr de tous les pods</span></li>
                  <li><span class="icon">&#10003;</span><span><strong>Logs système</strong> — syslog, kernel, kubelet centralisés</span></li>
                  <li><span class="icon">&#10003;</span><span><strong>Détection d'anomalies</strong> — Erreurs et warnings en temps réel</span></li>
                  <li><span class="icon">&#10003;</span><span><strong>Audit complet</strong> — Qui a fait quoi, où, quand</span></li>
                  <li><span class="icon">&#10003;</span><span><strong>Trace des délétions</strong> — Chaque suppression est enregistrée</span></li>
                  <li><span class="icon">&#10003;</span><span><strong>Accès sensibles</strong> — Secrets et ConfigMaps sous surveillance</span></li>
                  <li><span class="icon">&#10003;</span><span><strong>Scan de vulnérabilités</strong> — Résultats Trivy centralisés dans DefectDojo</span></li>
                  <li><span class="icon">&#10003;</span><span><strong>Détection runtime</strong> — Comportements suspects via Falco</span></li>
                  <li><span class="icon">&#10003;</span><span><strong>Conformité CIS</strong> — Benchmark kube-bench sur tous les nœuds</span></li>
                </ul>
              </div>
            </div>

            <div class="section">
              <div class="section-header gray">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2d3748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/></svg>
                Stockage &amp; Rétention
              </div>
              <div class="section-body">
                <table class="ret-table">
                  <tr><th>Type</th><th>Rétention</th><th>Taille</th><th>Rotation</th></tr>
                  <tr><td><strong>Audit Logs</strong></td><td><span class="badge-blue">30 jours</span></td><td>100 MB / fichier</td><td>10 backups</td></tr>
                  <tr><td><strong>Loki (tous les logs)</strong></td><td><span class="badge-green">Persistant</span></td><td>10 Gi</td><td>Automatique</td></tr>
                  <tr><td><strong>Rapports Sécurité</strong></td><td><span class="badge-blue">Par date</span></td><td>—</td><td>/var/log/</td></tr>
                </table>
              </div>
            </div>

            <div class="section">
              <div class="section-header blue">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2b6cb0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></svg>
                Prochaines Étapes
              </div>
              <div class="section-body">
                <div class="step-item">
                  <div class="step-num">1</div>
                  <div class="step-content">
                    <h4>Accéder aux Dashboards Grafana</h4>
                    <p>Consultez les deux dashboards pour une visibilité complète du cluster en temps réel.</p>
                  </div>
                </div>
                <div class="step-item">
                  <div class="step-num">2</div>
                  <div class="step-content">
                    <h4>Tester les Commandes CLI</h4>
                    <p>Connectez-vous au master node et testez:</p>
                    <span class="step-cmd">audit-log help</span>
                    &nbsp;
                    <span class="step-cmd">cluster-logs help</span>
                  </div>
                </div>
                <div class="step-item">
                  <div class="step-num">3</div>
                  <div class="step-content">
                    <h4>Consulter les Rapports de Sécurité</h4>
                    <span class="step-cmd">cat /var/log/kube-bench-report-*.log</span>
                    &nbsp;
                    <span class="step-cmd">cat /var/log/kube-hunter-report-*.log</span>
                  </div>
                </div>
                <div class="step-item">
                  <div class="step-num">4</div>
                  <div class="step-content">
                    <h4>Configurer les Alertes Grafana</h4>
                    <p>Créez des alertes sur les panneaux erreurs/warnings pour être notifié proactivement.</p>
                  </div>
                </div>
                <div class="step-item">
                  <div class="step-num">5</div>
                  <div class="step-content">
                    <h4>Traiter les Vulnérabilités dans DefectDojo</h4>
                    <p>Accédez à DefectDojo pour trier et assigner les findings Trivy à l'équipe de sécurité.</p>
                  </div>
                </div>
              </div>
            </div>

          </div>

          <div class="footer">
            <strong>{{ deployment_info.project_name }}</strong><br>
            Rapport généré automatiquement · {{ deployment_info.deployment_date }}<br>
            <hr class="divider">
            Documentation:
            <a href="https://grafana.com/docs/loki/">Loki</a> ·
            <a href="https://grafana.com/docs/grafana/">Grafana</a> ·
            <a href="https://kubernetes.io/docs/tasks/debug-application-cluster/audit/">Kubernetes Audit</a> ·
            <a href="https://defectdojo.com/docs/">DefectDojo</a> ·
            <a href="https://falco.org/docs/">Falco</a>
          </div>

        </div>
      </body>
      </html>
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Send professional HTML deployment report email with SMTP
  shell: |
    EMAIL_TO="{{ email_recipient }}"
    EMAIL_SUBJECT="[{{ deployment_info.project_name }}] Rapport de Déploiement – $(date '+%d/%m/%Y %H:%M')"

    if [ -f /tmp/deployment-summary.txt ]; then
      mutt -e "set content_type=text/html" \
           -s "$EMAIL_SUBJECT" \
           -a "/tmp/deployment-summary.txt" \
           -- "$EMAIL_TO" < /tmp/deployment-report.html
    else
      mutt -e "set content_type=text/html" \
           -s "$EMAIL_SUBJECT" \
           -- "$EMAIL_TO" < /tmp/deployment-report.html
    fi

    echo "Email professionnel envoyé à: $EMAIL_TO"
  register: email_result
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  ignore_errors: true

- name: Check email send status
  debug:
    msg: |
      Email Status:
      Command: {{ email_result.cmd }}
      Return Code: {{ email_result.rc }}
      {% if email_result.rc == 0 %}
      SUCCESS - Email sent to {{ email_recipient }}
      {% else %}
      WARNING - Check SMTP configuration
      Logs available at: /root/.msmtp.log
      {% endif %}
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Print final confirmation
  debug:
    msg: |
      ╔══════════════════════════════════════════════════════╗
      ║       EMAIL REPORT CONFIGURATION COMPLETE            ║
      ╠══════════════════════════════════════════════════════╣
      ║  Destinataire : {{ email_recipient }}
      ║  Corps        : HTML (rendu professionnel)           ║
      ║  Pièce jointe : deployment-summary.txt              ║
      ║  HTML local   : /tmp/deployment-report.html          ║
      ║  SMTP Config  : /root/.msmtprc                       ║
      ║  Mutt Config  : /root/.muttrc                        ║
      ║  Logs         : /root/.msmtp.log                     ║
      ╚══════════════════════════════════════════════════════╝
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true


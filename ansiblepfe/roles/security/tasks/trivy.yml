- name: Check number of available worker nodes
  shell: |
    kubectl get nodes --no-headers \
      | grep -v master | grep -v control-plane \
      | grep -c " Ready" || true
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: worker_count
  changed_when: false

- name: Display worker count
  debug:
    msg: "Workers disponibles : {{ worker_count.stdout | trim }}"
  run_once: true

- name: Deploy Django HA script
  copy:
    dest: /tmp/django_ha.sh
    mode: "0755"
    force: true
    content: |
      #!/bin/sh
      export KUBECONFIG=/home/ubuntu/.kube/config
      kubectl scale deployment defectdojo-django \
        --replicas=2 -n defectdojo 2>/dev/null || true
      kubectl patch deployment defectdojo-django -n defectdojo \
        --type=json -p '[
          {
            "op":"replace",
            "path":"/spec/template/spec/affinity",
            "value":{
              "nodeAffinity":{
                "preferredDuringSchedulingIgnoredDuringExecution":[{
                  "weight":100,
                  "preference":{
                    "matchExpressions":[{
                      "key":"node-role.kubernetes.io/control-plane",
                      "operator":"DoesNotExist"
                    }]
                  }
                }]
              },
              "podAntiAffinity":{
                "preferredDuringSchedulingIgnoredDuringExecution":[{
                  "weight":100,
                  "podAffinityTerm":{
                    "labelSelector":{
                      "matchLabels":{
                        "defectdojo.org/component":"django"
                      }
                    },
                    "topologyKey":"kubernetes.io/hostname"
                  }
                }]
              }
            }
          }
        ]' 2>/dev/null || true
      echo "Django HA configured - 2 replicas, prefer workers, soft anti-affinity"
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  when: worker_count.stdout | trim | int >= 2

- name: Run Django HA script
  command: /tmp/django_ha.sh
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: django_ha_result
  ignore_errors: true
  when: worker_count.stdout | trim | int >= 2


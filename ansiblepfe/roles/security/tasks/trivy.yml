# ══════════════════════════════════════════════════════════════════════════════
# MODIFICATION : PDB celery-beat avec minAvailable=1 (2 replicas)
# ══════════════════════════════════════════════════════════════════════════════

- name: Deploy Celery Beat PDB manifest
  copy:
    dest: /tmp/celery-beat-pdb.yml
    mode: "0644"
    force: true
    content: |
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: defectdojo-celery-beat-pdb
        namespace: defectdojo
      spec:
        minAvailable: 1
        selector:
          matchLabels:
            app.kubernetes.io/name: defectdojo
            defectdojo.org/subcomponent: beat
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Apply Celery Beat PDB
  command: kubectl apply -f /tmp/celery-beat-pdb.yml
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  ignore_errors: true

- name: Check current PostgreSQL node
  shell: |
    kubectl get pod defectdojo-postgresql-0 -n defectdojo \
      -o jsonpath='{.spec.nodeName}' 2>/dev/null || echo "unknown"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: pg_node
  changed_when: false

- name: Check PostgreSQL PVC binding node
  shell: |
    PVC=$(kubectl get pvc -n defectdojo \
      -l app.kubernetes.io/name=postgresql \
      -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
    if [ -z "$PVC" ]; then
      PVC=$(kubectl get pvc -n defectdojo --no-headers \
        | grep postgres | awk '{print $1}' | head -1)
    fi
    echo "PVC: $PVC"
    SC=$(kubectl get pvc "$PVC" -n defectdojo \
      -o jsonpath='{.spec.storageClassName}' 2>/dev/null || echo "unknown")
    echo "StorageClass: $SC"
    STATUS=$(kubectl get pvc "$PVC" -n defectdojo \
      -o jsonpath='{.status.phase}' 2>/dev/null || echo "unknown")
    echo "Status: $STATUS"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: pg_pvc_info
  changed_when: false

- name: "[HA-PG] Vérifier binding PVC NFS PostgreSQL"
  shell: |
    echo "→ Attente binding PVC NFS PostgreSQL..."
    for i in $(seq 1 30); do
      SC=$(kubectl get pvc data-defectdojo-postgresql-0 -n defectdojo \
        -o jsonpath='{.spec.storageClassName}' 2>/dev/null || echo "")
      STATUS=$(kubectl get pvc data-defectdojo-postgresql-0 -n defectdojo \
        -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
      echo "  Attempt $i — StorageClass=$SC Status=$STATUS"
      if [ "$STATUS" = "Bound" ] && [ "$SC" = "nfs" ]; then
        echo "✓ PVC NFS PostgreSQL Bound"
        exit 0
      fi
      sleep 5
    done
    echo "⚠ PVC non Bound apres 150s — diagnostic :"
    kubectl describe pvc data-defectdojo-postgresql-0 -n defectdojo 2>/dev/null || true
    exit 1
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: pg_nfs_bound
  ignore_errors: true

- name: "[HA-PG] Afficher statut binding PVC NFS"
  debug:
    msg: "{{ pg_nfs_bound.stdout_lines }}"
  run_once: true

- name: "[HA-PG] Attendre PostgreSQL Running"
  shell: |
    for i in $(seq 1 40); do
      READY=$(kubectl get pod defectdojo-postgresql-0 -n defectdojo \
        -o jsonpath='{.status.containerStatuses[0].ready}' 2>/dev/null || echo "false")
      NODE=$(kubectl get pod defectdojo-postgresql-0 -n defectdojo \
        -o jsonpath='{.spec.nodeName}' 2>/dev/null || echo "?")
      SC=$(kubectl get pvc data-defectdojo-postgresql-0 -n defectdojo \
        -o jsonpath='{.spec.storageClassName}' 2>/dev/null || echo "?")
      echo "  Attempt $i — ready=$READY node=$NODE storageClass=$SC"
      if [ "$READY" = "true" ]; then
        echo "✓ PostgreSQL operationnel sur $NODE avec storageClass=$SC"
        exit 0
      fi
      sleep 5
    done
    echo "⚠ Timeout PostgreSQL (non bloquant)"
    exit 0
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: pg_nfs_ready
  changed_when: false
  ignore_errors: true

- name: "[HA-PG] Afficher état PostgreSQL"
  debug:
    msg: "{{ pg_nfs_ready.stdout_lines }}"
  run_once: true

- name: "[HA-PG] Restaurer backup PostgreSQL dans nouveau PVC NFS"
  shell: |
    BACKUP="{{ pg_backup_file | default('') | trim }}"
    if [ -z "$BACKUP" ] || [ ! -f "$BACKUP" ]; then
      echo "Aucun backup a restaurer"
      exit 0
    fi
    LINES=$(wc -l < "$BACKUP" 2>/dev/null || echo "0")
    if [ "$LINES" -lt 10 ]; then
      echo "⚠ Backup trop petit ($LINES lignes) — skip"
      exit 0
    fi
    PGPASS=$(kubectl get secret defectdojo-postgresql-specific -n defectdojo \
      -o jsonpath='{.data.postgresql-password}' 2>/dev/null | base64 --decode || echo "")
    echo "→ Restauration de $BACKUP ($LINES lignes)..."
    kubectl exec -i -n defectdojo defectdojo-postgresql-0 -- \
      env PGPASSWORD="$PGPASS" psql -U defectdojo defectdojo < "$BACKUP"
    echo "✓ Restauration terminee"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: pg_restore_result
  changed_when: "'Restauration terminee' in pg_restore_result.stdout"
  ignore_errors: true

- name: "[HA-PG] Afficher résultat restauration"
  debug:
    msg: "{{ pg_restore_result.stdout_lines }}"
  run_once: true

- name: "[HA-PG] Résumé final NFS PostgreSQL"
  debug:
    msg:
      - "PostgreSQL - Resume HA NFS"
      - "StorageClass : {{ pg_pvc_info.stdout_lines }}"
      - "Node actuel  : {{ pg_node.stdout }}"
      - "Tolerations  : not-ready=30s unreachable=30s"
      - "Panne worker → postgresql reschedule en ~2-3 min"
  run_once: true

- name: Ensure PostgreSQL StatefulSet has NO nodeSelector
  shell: |
    HAS_SELECTOR=$(kubectl get statefulset defectdojo-postgresql -n defectdojo \
      -o jsonpath='{.spec.template.spec.nodeSelector}' 2>/dev/null)
    if [ -n "$HAS_SELECTOR" ] && [ "$HAS_SELECTOR" != "{}" ] \
      && [ "$HAS_SELECTOR" != "null" ]; then
      kubectl patch statefulset defectdojo-postgresql -n defectdojo \
        --type=json -p '[
          {"op": "remove", "path": "/spec/template/spec/nodeSelector"}
        ]' 2>/dev/null || true
      echo "nodeSelector supprime"
    else
      echo "Pas de nodeSelector - rien a faire"
    fi
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  ignore_errors: true

- name: Wait for PostgreSQL to be Running
  shell: |
    for i in $(seq 1 40); do
      STATUS=$(kubectl get pod defectdojo-postgresql-0 -n defectdojo \
        -o jsonpath='{.status.phase}' 2>/dev/null)
      READY=$(kubectl get pod defectdojo-postgresql-0 -n defectdojo \
        -o jsonpath='{.status.containerStatuses[0].ready}' 2>/dev/null || echo "false")
      echo "Attempt $i - Status: $STATUS | Ready: $READY"
      if [ "$STATUS" = "Running" ] && [ "$READY" = "true" ]; then
        echo "PostgreSQL operationnel"
        exit 0
      fi
      sleep 5
    done
    echo "Timeout PostgreSQL (non bloquant)"
    exit 0
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: pg_recovery
  changed_when: false
  ignore_errors: true

- name: Display PostgreSQL recovery status
  debug:
    msg: "{{ pg_recovery.stdout_lines }}"
  run_once: true

- name: Deploy PostgreSQL PDB manifest
  copy:
    dest: /tmp/postgresql-pdb.yml
    mode: "0644"
    force: true
    content: |
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: defectdojo-postgresql-pdb
        namespace: defectdojo
      spec:
        minAvailable: 1
        selector:
          matchLabels:
            app.kubernetes.io/name: postgresql
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Apply PostgreSQL PDB
  command: kubectl apply -f /tmp/postgresql-pdb.yml
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  ignore_errors: true

- name: Wait for HA rollout to complete
  shell: |
    kubectl rollout status deployment/defectdojo-django \
      -n defectdojo --timeout=600s 2>/dev/null || true
    kubectl rollout status deployment/defectdojo-celery-worker \
      -n defectdojo --timeout=300s 2>/dev/null || true
    kubectl rollout status deployment/defectdojo-celery-beat \
      -n defectdojo --timeout=300s 2>/dev/null || true
    echo "Rollout HA termine"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  when: worker_count.stdout | trim | int >= 2
  ignore_errors: true

- name: Verify pod distribution across nodes
  shell: |
    echo "=== Distribution des pods DefectDojo ==="
    kubectl get pods -n defectdojo -o wide --no-headers \
      | awk '{print $7, $1, $3}' | sort
    echo ""
    echo "=== Resume par noeud ==="
    kubectl get pods -n defectdojo -o wide --no-headers \
      | awk '{print $7}' | sort | uniq -c | sort -rn
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: pod_distribution
  changed_when: false

- name: Display pod distribution
  debug:
    msg: "{{ pod_distribution.stdout_lines }}"
  run_once: true

- name: Failover simulation info
  shell: |
    echo "=== Test de resilience ==="
    DJANGO_NODES=$(kubectl get pods -n defectdojo \
      -l "defectdojo.org/component=django" \
      -o wide --no-headers 2>/dev/null \
      | awk '{print $7}' | sort -u | tr '\n' ', ')
    echo "Django sur : $DJANGO_NODES"
    CELERY_NODES=$(kubectl get pods -n defectdojo \
      -l "defectdojo.org/component=worker" \
      -o wide --no-headers 2>/dev/null \
      | awk '{print $7}' | sort -u | tr '\n' ', ')
    echo "Celery worker sur : $CELERY_NODES"
    BEAT_NODES=$(kubectl get pods -n defectdojo \
      -l "defectdojo.org/subcomponent=beat" \
      -o wide --no-headers 2>/dev/null \
      | awk '{print $7}' | sort -u | tr '\n' ', ')
    echo "Celery beat sur : $BEAT_NODES"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: failover_info
  changed_when: false

- name: Display failover information
  debug:
    msg: "{{ failover_info.stdout_lines }}"
  run_once: true

# ══════════════════════════════════════════════════════════════════════════════
# VALKEY - HAUTE DISPONIBILITE
# ══════════════════════════════════════════════════════════════════════════════

- name: Check current Valkey replica count
  shell: |
    kubectl get statefulset defectdojo-valkey -n defectdojo \
      -o jsonpath='{.spec.replicas}' 2>/dev/null || echo "0"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: valkey_replicas
  changed_when: false

- name: Display current Valkey state
  debug:
    msg: "Valkey replicas actuels : {{ valkey_replicas.stdout | trim }}"
  run_once: true

- name: Upgrade Valkey HA via Helm
  command: >
    helm upgrade defectdojo defectdojo/defectdojo
    --namespace defectdojo
    --reuse-values
    --set valkey.enabled=true
    --set valkey.architecture=replication
    --set valkey.replica.replicaCount=2
    --set valkey.sentinel.enabled=true
    --set valkey.sentinel.masterSet=mymaster
    --set valkey.sentinel.quorum=2
    --set valkey.sentinel.resources.requests.memory=64Mi
    --set valkey.sentinel.resources.limits.memory=128Mi
    --set valkey.master.resources.requests.memory=128Mi
    --set valkey.master.resources.limits.memory=512Mi
    --set valkey.replica.resources.requests.memory=128Mi
    --set valkey.replica.resources.limits.memory=512Mi
    --set valkey.master.podAntiAffinity=soft
    --set valkey.replica.podAntiAffinity=soft
    --set valkey.master.persistence.storageClass=nfs
    --set valkey.replica.persistence.storageClass=nfs
    --set valkey.master.tolerations[0].key=node.kubernetes.io/not-ready
    --set valkey.master.tolerations[0].operator=Exists
    --set valkey.master.tolerations[0].effect=NoExecute
    --set valkey.master.tolerations[0].tolerationSeconds=30
    --set valkey.master.tolerations[1].key=node.kubernetes.io/unreachable
    --set valkey.master.tolerations[1].operator=Exists
    --set valkey.master.tolerations[1].effect=NoExecute
    --set valkey.master.tolerations[1].tolerationSeconds=30
    --set valkey.replica.tolerations[0].key=node.kubernetes.io/not-ready
    --set valkey.replica.tolerations[0].operator=Exists
    --set valkey.replica.tolerations[0].effect=NoExecute
    --set valkey.replica.tolerations[0].tolerationSeconds=30
    --set valkey.replica.tolerations[1].key=node.kubernetes.io/unreachable
    --set valkey.replica.tolerations[1].operator=Exists
    --set valkey.replica.tolerations[1].effect=NoExecute
    --set valkey.replica.tolerations[1].tolerationSeconds=30
    --timeout=10m
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: valkey_ha_upgrade
  ignore_errors: true
  when: valkey_replicas.stdout | trim | int < 2

- name: Display Valkey HA upgrade result
  debug:
    msg: "{{ valkey_ha_upgrade.stdout_lines | default(['Skipped - already HA']) }}"
  run_once: true

- name: Deploy Valkey fallback scale script
  copy:
    dest: /tmp/valkey_ha.sh
    mode: "0755"
    force: true
    content: |
      #!/bin/sh
      export KUBECONFIG=/home/ubuntu/.kube/config
      kubectl scale statefulset defectdojo-valkey \
        --replicas=3 -n defectdojo
      kubectl patch statefulset defectdojo-valkey -n defectdojo \
        --type=json -p '[
          {
            "op":"replace",
            "path":"/spec/template/spec/affinity",
            "value":{
              "podAntiAffinity":{
                "preferredDuringSchedulingIgnoredDuringExecution":[{
                  "weight":100,
                  "podAffinityTerm":{
                    "labelSelector":{
                      "matchLabels":{
                        "app.kubernetes.io/name":"valkey"
                      }
                    },
                    "topologyKey":"kubernetes.io/hostname"
                  }
                }]
              }
            }
          }
        ]' 2>/dev/null || true
      echo "Valkey scaled to 3 replicas with soft anti-affinity"
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  when:
    - valkey_ha_upgrade is failed or valkey_ha_upgrade is skipped
    - valkey_replicas.stdout | trim | int < 2

- name: Run Valkey fallback scale script
  command: /tmp/valkey_ha.sh
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: valkey_fallback_result
  ignore_errors: true
  when:
    - valkey_ha_upgrade is failed or valkey_ha_upgrade is skipped
    - valkey_replicas.stdout | trim | int < 2

- name: Display Valkey fallback result
  debug:
    msg: "{{ valkey_fallback_result.stdout_lines | default(['Skipped']) }}"
  run_once: true

- name: Re-check broker config after Valkey HA upgrade
  shell: |
    CM=$(kubectl get configmap -n defectdojo -o json \
      | python3 -c "
    import json, sys
    cms = json.load(sys.stdin)['items']
    for cm in cms:
        if 'DD_CELERY_BROKER_PATH' in cm.get('data', {}):
            print(cm['metadata']['name'])
            break
    " 2>/dev/null || echo "")
    if [ -z "$CM" ]; then
      echo "NOT_FOUND"
      exit 0
    fi
    HOST=$(kubectl get configmap "$CM" -n defectdojo \
      -o jsonpath='{.data.DD_CELERY_BROKER_HOST}' 2>/dev/null || echo "")
    PORT=$(kubectl get configmap "$CM" -n defectdojo \
      -o jsonpath='{.data.DD_CELERY_BROKER_PORT}' 2>/dev/null || echo "")
    PATH_VAL=$(kubectl get configmap "$CM" -n defectdojo \
      -o jsonpath='{.data.DD_CELERY_BROKER_PATH}' 2>/dev/null || echo "")
    echo "$CM|$HOST|$PORT|$PATH_VAL"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: broker_recheck
  changed_when: false

- name: Run broker re-patch if needed
  command: /tmp/broker_patch.sh {{ broker_recheck.stdout.split('|')[0] }}
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: broker_repatch_result
  changed_when: "'Patch applique' in broker_repatch_result.stdout"
  ignore_errors: true
  when:
    - broker_recheck.stdout | trim != 'NOT_FOUND'
    - broker_recheck.stdout.split('|') | length >= 4
    - broker_recheck.stdout.split('|')[1] != 'defectdojo-valkey-sentinel'
      or broker_recheck.stdout.split('|')[2] != '26379'
      or broker_recheck.stdout.split('|')[3] != '/0'

- name: Display re-patch result
  debug:
    msg: "{{ broker_repatch_result.stdout_lines | default(['Broker config OK']) }}"
  run_once: true

- name: Restart Celery after re-patch
  shell: |
    kubectl rollout restart deployment/defectdojo-celery-worker -n defectdojo
    kubectl rollout restart deployment/defectdojo-celery-beat -n defectdojo
    kubectl rollout status deployment/defectdojo-celery-worker \
      -n defectdojo --timeout=120s 2>/dev/null || true
    echo "Celery restarted after re-patch"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  when: broker_repatch_result.changed | default(false)
  ignore_errors: true

- name: Deploy Valkey PDB manifest
  copy:
    dest: /tmp/valkey-pdb.yml
    mode: "0644"
    force: true
    content: |
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: defectdojo-valkey-pdb
        namespace: defectdojo
      spec:
        minAvailable: 1
        selector:
          matchLabels:
            app.kubernetes.io/name: valkey
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Apply Valkey PDB
  command: kubectl apply -f /tmp/valkey-pdb.yml
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  ignore_errors: true

- name: Wait for Valkey replicas to be Running
  shell: |
    for i in $(seq 1 30); do
      READY=$(kubectl get statefulset defectdojo-valkey \
        -n defectdojo \
        -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "0")
      DESIRED=$(kubectl get statefulset defectdojo-valkey \
        -n defectdojo \
        -o jsonpath='{.spec.replicas}' 2>/dev/null || echo "0")
      echo "Attempt $i - Ready: ${READY:-0}/${DESIRED:-0}"
      if [ "${READY:-0}" -ge 1 ] && [ "${READY:-0}" = "$DESIRED" ]; then
        echo "Valkey HA OK - ${READY}/${DESIRED} replicas ready"
        exit 0
      fi
      sleep 5
    done
    echo "Timeout Valkey HA - non bloquant"
    exit 0
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: valkey_ha_wait
  changed_when: false
  ignore_errors: true

- name: Display Valkey wait result
  debug:
    msg: "{{ valkey_ha_wait.stdout_lines }}"
  run_once: true

- name: "[HA-VALKEY-FIX] Diagnostiquer pod Valkey non ready"
  shell: |
    READY=$(kubectl get statefulset defectdojo-valkey -n defectdojo \
      -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "0")
    DESIRED=$(kubectl get statefulset defectdojo-valkey -n defectdojo \
      -o jsonpath='{.spec.replicas}' 2>/dev/null || echo "0")
    if [ "${READY:-0}" = "${DESIRED:-0}" ]; then
      echo "Valkey OK ${READY}/${DESIRED} — skip diagnostic"
      exit 0
    fi
    echo "=== Valkey ${READY:-0}/${DESIRED:-0} ready — diagnostic ==="
    kubectl get pods -n defectdojo -l app.kubernetes.io/name=valkey -o wide
    NOT_READY=$(kubectl get pods -n defectdojo \
      -l app.kubernetes.io/name=valkey \
      --no-headers 2>/dev/null \
      | awk '$2 != "2/2" {print $1}' | head -1)
    if [ -n "$NOT_READY" ]; then
      echo "--- Pod problematique : $NOT_READY ---"
      kubectl describe pod "$NOT_READY" -n defectdojo \
        | grep -A 8 "Conditions:\|Events:\|Warning\|Error" || true
      echo "--- Logs $NOT_READY ---"
      kubectl logs "$NOT_READY" -n defectdojo --tail=20 2>/dev/null || true
    fi
    echo "DIAG_DONE"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: valkey_diag
  changed_when: false
  ignore_errors: true

- name: "[HA-VALKEY-FIX] Afficher diagnostic Valkey"
  debug:
    msg: "{{ valkey_diag.stdout_lines }}"
  run_once: true

- name: "[HA-VALKEY-FIX] Tenter redémarrage pod Valkey non-ready"
  shell: |
    READY=$(kubectl get statefulset defectdojo-valkey -n defectdojo \
      -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "0")
    DESIRED=$(kubectl get statefulset defectdojo-valkey -n defectdojo \
      -o jsonpath='{.spec.replicas}' 2>/dev/null || echo "0")
    if [ "${READY:-0}" = "${DESIRED:-0}" ]; then
      echo "Valkey OK — skip restart"
      exit 0
    fi
    NOT_READY=$(kubectl get pods -n defectdojo \
      -l app.kubernetes.io/name=valkey \
      --no-headers 2>/dev/null \
      | awk '$2 != "2/2" {print $1}' | head -1)
    if [ -n "$NOT_READY" ]; then
      echo "→ Suppression pod bloque : $NOT_READY"
      kubectl delete pod "$NOT_READY" -n defectdojo \
        --grace-period=30 2>/dev/null
      sleep 10
      for i in $(seq 1 24); do
        READY_NEW=$(kubectl get statefulset defectdojo-valkey -n defectdojo \
          -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "0")
        echo "  Attempt $i — Ready: ${READY_NEW:-0}/${DESIRED:-0}"
        if [ "${READY_NEW:-0}" = "${DESIRED:-0}" ]; then
          echo "✓ Valkey ${READY_NEW}/${DESIRED} — tous prets"
          exit 0
        fi
        sleep 5
      done
      echo "⚠ Pod redemarre mais toujours pas ready — verifier manuellement"
    else
      echo "Aucun pod non-ready identifie — skip"
    fi
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: valkey_fix_result
  changed_when: "'Suppression' in valkey_fix_result.stdout"
  ignore_errors: true

- name: "[HA-VALKEY-FIX] Afficher résultat fix Valkey"
  debug:
    msg: "{{ valkey_fix_result.stdout_lines }}"
  run_once: true

- name: "[HA-VALKEY] Vérifier StorageClass finale Valkey"
  shell: |
    echo "=== StorageClass finale Valkey ==="
    kubectl get pvc -n defectdojo | grep valkey
    echo ""
    echo "=== Pods Valkey ==="
    kubectl get pods -n defectdojo -l app.kubernetes.io/name=valkey -o wide
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: valkey_final_check
  changed_when: false
  ignore_errors: true

- name: "[HA-VALKEY] Afficher état final Valkey"
  debug:
    msg: "{{ valkey_final_check.stdout_lines }}"
  run_once: true

- name: Deploy Valkey ping check script
  copy:
    dest: /tmp/valkey_ping.sh
    mode: "0755"
    force: true
    content: |
      #!/bin/sh
      export KUBECONFIG=/home/ubuntu/.kube/config
      PODS=$(kubectl get pods -n defectdojo \
        -l app.kubernetes.io/name=valkey \
        --no-headers -o custom-columns=":metadata.name" 2>/dev/null)
      echo "=== Valkey pods ==="
      for POD in $PODS; do
        PONG=$(kubectl exec -n defectdojo "$POD" -- \
          valkey-cli ping 2>/dev/null || echo "ERROR")
        echo "  $POD : $PONG"
      done
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Run Valkey ping check
  command: /tmp/valkey_ping.sh
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: valkey_ha_ping
  changed_when: false
  ignore_errors: true

- name: Display Valkey HA ping status
  debug:
    msg: "{{ valkey_ha_ping.stdout_lines }}"
  run_once: true

- name: Display Valkey HA summary
  debug:
    msg:
      - "Valkey HA - Resume"
      - "Mode        : Replication (master + 2 replicas)"
      - "Sentinel    : quorum=2 (failover auto si master down)"
      - "StorageClass: NFS"
      - "PDB         : minAvailable=1"
      - "Tolerations : not-ready=30s unreachable=30s"
      - "Broker      : HOST=defectdojo-valkey-sentinel PORT=26379 PATH=/0"
  run_once: true

# ══════════════════════════════════════════════════════════════════════════════
# WAIT FOR SERVICES
# ══════════════════════════════════════════════════════════════════════════════

- name: Wait for PostgreSQL to accept connections
  shell: |
    PG_POD=$(kubectl get pod -n defectdojo -l app.kubernetes.io/name=postgresql \
      -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
    if [ -z "$PG_POD" ]; then
      echo "Pod PostgreSQL non trouve (non bloquant)"
      exit 0
    fi
    for i in $(seq 1 30); do
      PG_RESPONSE=$(kubectl exec -n defectdojo $PG_POD -- \
        pg_isready -U postgres 2>/dev/null || echo "no")
      echo "Attempt $i - PostgreSQL: $PG_RESPONSE"
      if echo "$PG_RESPONSE" | grep -q "accepting"; then
        echo "PostgreSQL accepte les connexions"
        exit 0
      fi
      sleep 3
    done
    echo "PostgreSQL timeout (non bloquant)"
    exit 0
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  ignore_errors: true

- name: Wait for Celery worker to be ready
  shell: |
    CELERY_POD=""
    for i in $(seq 1 10); do
      CELERY_POD=$(kubectl get pods -n defectdojo --no-headers 2>/dev/null \
        | grep "defectdojo-celery-worker" | grep "1/1" | head -1 | awk '{print $1}')
      if [ -n "$CELERY_POD" ]; then
        echo "Pod Celery trouve: $CELERY_POD"
        break
      fi
      echo "Attempt $i - Pod Celery non trouve..."
      sleep 3
    done
    if [ -z "$CELERY_POD" ]; then
      echo "Aucun pod Celery trouve (non bloquant)"
      exit 0
    fi
    for i in $(seq 1 30); do
      WORKER_READY=$(kubectl get pod -n defectdojo $CELERY_POD \
        -o jsonpath='{.status.containerStatuses[0].ready}' 2>/dev/null || echo "false")
      echo "Attempt $i - Celery ready: $WORKER_READY"
      [ "$WORKER_READY" = "true" ] && exit 0
      sleep 5
    done
    echo "Celery worker not ready (non bloquant)"
    exit 0
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  ignore_errors: true

- name: Wait for DefectDojo initializer to complete
  shell: |
    for i in $(seq 1 36); do
      STATUS=$(kubectl get pods -n defectdojo --no-headers 2>/dev/null \
        | grep initializer | awk '{print $3}' | head -1)
      echo "Attempt $i/36 - Initializer: ${STATUS:-not found}"
      if [ "$STATUS" = "Completed" ]; then
        echo "Initializer completed"
        exit 0
      fi
      if [ "$STATUS" = "Error" ] || [ "$STATUS" = "CrashLoopBackOff" ]; then
        echo "Initializer failed: $STATUS (non bloquant)"
        exit 0
      fi
      sleep 5
    done
    echo "Timeout initializer (non bloquant)"
    exit 0
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: initializer_wait
  changed_when: false
  ignore_errors: true

- name: Wait for DefectDojo django deployment rollout
  command: >
    kubectl rollout status deployment/defectdojo-django
    --namespace defectdojo --timeout=600s
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  retries: 3
  delay: 30
  register: rollout_status
  until: rollout_status.rc == 0
  ignore_errors: true

- name: Show DefectDojo pods status
  command: kubectl get pods -n defectdojo -o wide
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: dojo_pods

- name: Display DefectDojo pods
  debug:
    msg: "{{ dojo_pods.stdout_lines }}"
  run_once: true

- name: Wait for django pod to be fully ready (2/2)
  shell: |
    for i in $(seq 1 60); do
      READY=$(kubectl get pods -n defectdojo --no-headers 2>/dev/null \
        | grep django | grep Running | awk '{print $2}' | grep -c "2/2" || true)
      echo "Attempt $i - Ready 2/2 pods: $READY"
      if [ "$READY" -ge 1 ]; then
        echo "Django pod is fully ready"
        exit 0
      fi
      if [ $((i % 10)) -eq 0 ]; then
        kubectl get pods -n defectdojo --no-headers 2>/dev/null | grep django || true
      fi
      sleep 10
    done
    echo "Timeout django (non bloquant)"
    exit 0
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: django_ready_wait
  changed_when: false
  ignore_errors: true

- name: Display django readiness result
  debug:
    msg: "{{ django_ready_wait.stdout_lines }}"
  run_once: true

# ══════════════════════════════════════════════════════════════════════════════
# FIX CSRF
# ══════════════════════════════════════════════════════════════════════════════

- name: "[CSRF-FIX] Patch ConfigMap defectdojo pour désactiver CSRF/Session secure"
  shell: |
    kubectl patch configmap defectdojo -n defectdojo --type merge -p '{
      "data": {
        "DD_SESSION_COOKIE_SECURE": "False",
        "DD_CSRF_COOKIE_SECURE": "False"
      }
    }' 2>/dev/null && echo "ConfigMap patche" || echo "Patch ConfigMap echoue (non bloquant)"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: csrf_configmap_result
  changed_when: "'patche' in csrf_configmap_result.stdout"
  ignore_errors: true

- name: "[CSRF-FIX] Afficher résultat patch ConfigMap"
  debug:
    msg: "{{ csrf_configmap_result.stdout_lines }}"
  run_once: true

- name: "[CSRF-FIX] Forcer les variables CSRF/Session sur le deployment Django"
  shell: |
    kubectl set env deployment/defectdojo-django -n defectdojo \
      DD_SESSION_COOKIE_SECURE=False \
      DD_CSRF_COOKIE_SECURE=False 2>/dev/null \
      && echo "Variables env appliquees" || echo "set env echoue (non bloquant)"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: csrf_env_result
  changed_when: "'appliquees' in csrf_env_result.stdout"
  ignore_errors: true

- name: "[CSRF-FIX] Afficher résultat set env"
  debug:
    msg: "{{ csrf_env_result.stdout_lines }}"
  run_once: true

- name: "[CSRF-FIX] Redémarrer Django après patch CSRF"
  shell: |
    kubectl rollout restart deployment/defectdojo-django -n defectdojo
    kubectl rollout status deployment/defectdojo-django \
      -n defectdojo --timeout=300s 2>/dev/null || true
    echo "Django redemarre apres fix CSRF"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: csrf_rollout_result
  changed_when: "'redemarre' in csrf_rollout_result.stdout"
  ignore_errors: true
  when: csrf_configmap_result.changed or csrf_env_result.changed

- name: "[CSRF-FIX] Afficher résultat redémarrage Django"
  debug:
    msg: "{{ csrf_rollout_result.stdout_lines | default(['Skip — aucun changement detecte']) }}"
  run_once: true

# ══════════════════════════════════════════════════════════════════════════════
# DEFECTDOJO - SECRETS & TOKEN
# ══════════════════════════════════════════════════════════════════════════════

- name: Get DefectDojo admin password
  shell: |
    kubectl get secret defectdojo -n defectdojo \
      -o jsonpath='{.data.DD_ADMIN_PASSWORD}' 2>/dev/null \
      | base64 --decode 2>/dev/null || echo "PASSWORD_NOT_FOUND"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: dojo_admin_password
  changed_when: false
  no_log: true

- name: Get PostgreSQL password from secret
  shell: |
    kubectl get secret defectdojo-postgresql-specific -n defectdojo \
      -o jsonpath='{.data.postgresql-password}' | base64 --decode
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: dojo_pg_password
  changed_when: false
  ignore_errors: true
  no_log: true

- name: Get API Token via PostgreSQL
  shell: |
    PGPASS="{{ dojo_pg_password.stdout | default('') | trim }}"
    kubectl exec -n defectdojo defectdojo-postgresql-0 -- \
      env PGPASSWORD="$PGPASS" psql -U defectdojo -d defectdojo -t -A -c \
      "SELECT at.key FROM authtoken_token at
       JOIN auth_user u ON at.user_id = u.id
       WHERE u.username = 'admin' LIMIT 1;" \
      2>/dev/null | tr -d ' \n\r' || true
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: dojo_token_psql
  changed_when: false
  ignore_errors: true
  no_log: true

- name: Set API token fact
  set_fact:
    dojo_token_final: "{{ dojo_token_psql.stdout | default('') | trim }}"

- name: Display token status
  debug:
    msg: "Token: {{ 'OK - ' + dojo_token_final[:8] + '...' if dojo_token_final != '' else 'ECHEC - token vide' }}"
  run_once: true

- name: Get Django pod name (2/2 Running)
  shell: |
    kubectl get pod -n defectdojo --no-headers \
      | grep django | grep Running | grep "2/2" | awk '{print $1}' | head -1
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: django_pod_name
  changed_when: false
  ignore_errors: true

- name: Display django pod name
  debug:
    msg: "Django pod: {{ django_pod_name.stdout | trim }}"
  run_once: true

- name: Sync admin password from secret to Django DB
  shell: |
    DD_PASS=$(kubectl get secret defectdojo -n defectdojo \
      -o jsonpath='{.data.DD_ADMIN_PASSWORD}' | base64 --decode)
    DJANGO_POD="{{ django_pod_name.stdout | trim }}"
    if [ -z "$DJANGO_POD" ]; then
      echo "Pod Django non trouve (non bloquant)"
      exit 0
    fi
    kubectl exec -n defectdojo "$DJANGO_POD" -c uwsgi -- \
      python -c "
      import django, os
      os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'dojo.settings.settings')
      django.setup()
      from django.contrib.auth.models import User
      u = User.objects.get(username='admin')
      u.set_password('${DD_PASS}')
      u.save()
      print('Password synced successfully')
      " 2>/dev/null \
      && echo "Password admin synchronise" \
      || echo "Sync password echoue (non bloquant)"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  changed_when: false
  ignore_errors: true
  when: django_pod_name.stdout | trim != ''

# ══════════════════════════════════════════════════════════════════════════════
# DEFECTDOJO - PRODUCT + ENGAGEMENT + IMPORT
# ══════════════════════════════════════════════════════════════════════════════

- name: Deploy product creation script
  copy:
    dest: /tmp/dojo_product.sh
    mode: "0755"
    force: true
    content: |
      #!/bin/sh
      TOKEN="$1"
      POD="$2"
      PORT=18081
      export KUBECONFIG=/home/ubuntu/.kube/config
      log() { echo "[dojo_product] $*" >&2; }
      cleanup() { kill "$PF_PID" 2>/dev/null || true; sleep 1; }
      pkill -f "port-forward.*${PORT}" 2>/dev/null || true
      sleep 2
      kubectl port-forward "pod/${POD}" "${PORT}:8080" -n defectdojo \
        >/dev/null 2>&1 &
      PF_PID=$!
      trap cleanup EXIT
      READY=0
      for i in $(seq 1 30); do
        sleep 3
        HTTP=$(curl -sf --connect-timeout 5 \
          -o /dev/null -w "%{http_code}" \
          -H "Authorization: Token $TOKEN" \
          "http://localhost:${PORT}/api/v2/users/" 2>/dev/null || echo "000")
        log "  Attempt $i - HTTP $HTTP"
        if [ "$HTTP" = "200" ]; then READY=1; break; fi
      done
      curl -s --connect-timeout 10 \
        -X POST "http://localhost:${PORT}/api/v2/products/" \
        -H "Authorization: Token $TOKEN" \
        -H "Content-Type: application/json" \
        -d '{"name":"Kubernetes Cluster Security","description":"Vulnerability scans with Trivy","prod_type":1}' \
        -o /tmp/dojo_product_resp.json 2>/dev/null
      PRODUCT_ID=$(python3 -c "
      import json
      try:
          d = json.load(open('/tmp/dojo_product_resp.json'))
          pid = d.get('id', '')
          if pid: print(str(pid))
      except: pass
      " 2>/dev/null || true)
      if [ -z "$PRODUCT_ID" ]; then
        curl -s --connect-timeout 10 \
          "http://localhost:${PORT}/api/v2/products/?name=Kubernetes+Cluster+Security" \
          -H "Authorization: Token $TOKEN" \
          -o /tmp/dojo_product_fallback.json 2>/dev/null
        PRODUCT_ID=$(python3 -c "
      import json
      try:
          d = json.load(open('/tmp/dojo_product_fallback.json'))
          r = d.get('results', [])
          if r: print(str(r[0]['id']))
      except: pass
      " 2>/dev/null || true)
      fi
      if [ -z "$PRODUCT_ID" ]; then
        log "CRITICAL: Could not create or find product"
        echo ""; exit 1
      fi
      log "SUCCESS: Product ID = $PRODUCT_ID"
      echo "$PRODUCT_ID"
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  when: dojo_token_final != ''

- name: Create DefectDojo Product
  command: >
    /tmp/dojo_product.sh
    {{ dojo_token_final }}
    {{ django_pod_name.stdout | trim }}
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: dojo_product_result
  changed_when: false
  ignore_errors: true
  when:
    - dojo_token_final != ''
    - django_pod_name.stdout | trim != ''

- name: Debug product script output
  debug:
    msg:
      - "STDOUT : {{ dojo_product_result.stdout | default('(empty)') }}"
      - "STDERR : {{ dojo_product_result.stderr | default('(empty)') | regex_replace('Token [a-f0-9]+', 'Token ***') }}"
  run_once: true
  when: dojo_product_result is defined

- name: Set product ID
  set_fact:
    dojo_product_id: >-
      {{ dojo_product_result.stdout_lines
         | default([])
         | select('match', '^[0-9]+$')
         | list | last | default('') }}
  when: dojo_token_final != ''

- name: Set default product ID if empty
  set_fact:
    dojo_product_id: "1"
  when: dojo_token_final == '' or dojo_product_id | default('') == ''

- name: Display product status
  debug:
    msg: "Product ID: {{ dojo_product_id }}"
  run_once: true

- name: Set engagement name
  set_fact:
    dojo_engagement_name: "Trivy Scan {{ ansible_date_time.date }}"
  run_once: true

- name: Deploy engagement creation script
  copy:
    dest: /tmp/dojo_engagement.sh
    mode: "0755"
    force: true
    content: |
      #!/bin/sh
      TOKEN="$1"
      PRODUCT_ID="$2"
      SCAN_DATE="$3"
      POD="$4"
      ENGAGEMENT_NAME="$5"
      PORT=18082
      export KUBECONFIG=/home/ubuntu/.kube/config
      log() { echo "[dojo_engagement] $*" >&2; }
      cleanup() { kill "$PF_PID" 2>/dev/null || true; sleep 1; }
      pkill -f "port-forward.*${PORT}" 2>/dev/null || true
      sleep 2
      kubectl port-forward "pod/${POD}" "${PORT}:8080" -n defectdojo \
        >/dev/null 2>&1 &
      PF_PID=$!
      trap cleanup EXIT
      READY=0
      for i in $(seq 1 30); do
        sleep 3
        HTTP=$(curl -sf --connect-timeout 5 \
          -o /dev/null -w "%{http_code}" \
          -H "Authorization: Token $TOKEN" \
          "http://localhost:${PORT}/api/v2/users/" 2>/dev/null || echo "000")
        log "  Attempt $i - HTTP $HTTP"
        if [ "$HTTP" = "200" ]; then READY=1; break; fi
      done
      curl -s --connect-timeout 10 \
        -X POST "http://localhost:${PORT}/api/v2/engagements/" \
        -H "Authorization: Token $TOKEN" \
        -H "Content-Type: application/json" \
        -d "{
          \"name\": \"${ENGAGEMENT_NAME}\",
          \"product\": ${PRODUCT_ID},
          \"target_start\": \"${SCAN_DATE}\",
          \"target_end\": \"${SCAN_DATE}\",
          \"status\": \"In Progress\",
          \"deduplication_on_engagement\": false
        }" \
        -o /tmp/dojo_eng_resp.json 2>/dev/null
      ENG_ID=$(python3 -c "
      import json, sys
      try:
          d = json.load(open('/tmp/dojo_eng_resp.json'))
          eid = d.get('id', '')
          if eid: print(str(eid))
      except: pass
      " 2>/dev/null || true)
      if [ -z "$ENG_ID" ]; then
        curl -s --connect-timeout 10 \
          "http://localhost:${PORT}/api/v2/engagements/?product=${PRODUCT_ID}&limit=200&ordering=-id" \
          -H "Authorization: Token $TOKEN" \
          -o /tmp/dojo_eng_fallback.json 2>/dev/null
        ENG_ID=$(python3 -c "
      import json, sys
      try:
          d = json.load(open('/tmp/dojo_eng_fallback.json'))
          r = d.get('results', [])
          if r: print(str(r[0]['id']))
      except: pass
      " 2>/dev/null || true)
      fi
      if [ -z "$ENG_ID" ]; then
        log "CRITICAL: Could not create or retrieve engagement"
        echo ""; exit 1
      fi
      log "SUCCESS: Engagement ID = $ENG_ID"
      echo "$ENG_ID"
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  when: dojo_token_final != ''

- name: Create DefectDojo Engagement
  command: >
    /tmp/dojo_engagement.sh
    {{ dojo_token_final }}
    {{ dojo_product_id }}
    {{ ansible_date_time.date }}
    {{ django_pod_name.stdout | trim }}
    "{{ dojo_engagement_name }}"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: dojo_engagement_result
  changed_when: false
  ignore_errors: true
  when:
    - dojo_token_final != ''
    - django_pod_name.stdout | trim != ''

- name: Set engagement ID from result
  set_fact:
    dojo_engagement_id: >-
      {{ dojo_engagement_result.stdout_lines
         | default([])
         | select('match', '^[0-9]+$')
         | list | last | default('') }}
  when: dojo_token_final != ''

- name: Set default engagement ID if empty
  set_fact:
    dojo_engagement_id: "1"
  when: >
    dojo_token_final == ''
    or dojo_engagement_id | default('') == ''

- name: Display final engagement status
  debug:
    msg:
      - "Engagement Name : {{ dojo_engagement_name }}"
      - "Engagement ID   : {{ dojo_engagement_id }}"
  run_once: true

- name: Deploy import script
  copy:
    dest: /tmp/dojo_import.sh
    mode: "0755"
    force: true
    content: |
      #!/bin/sh
      TOKEN="$1"
      ENGAGEMENT_ID="$2"
      JSON_FILE="$3"
      IMAGE="$4"
      POD="$5"
      PORT=18091
      export KUBECONFIG=/home/ubuntu/.kube/config
      log() { echo "[dojo_import] $*" >&2; }
      if [ ! -f "$JSON_FILE" ]; then echo "SKIP: no file $JSON_FILE"; exit 0; fi
      SIZE=$(wc -c < "$JSON_FILE" 2>/dev/null || echo "0")
      if [ "$SIZE" -lt 10 ]; then echo "SKIP: file too small"; exit 0; fi
      cleanup() { kill "$PF_PID" 2>/dev/null || true; sleep 1; }
      pkill -f "port-forward.*${PORT}" 2>/dev/null || true
      sleep 1
      kubectl port-forward "pod/${POD}" "${PORT}:8080" -n defectdojo \
        >/dev/null 2>&1 &
      PF_PID=$!
      trap cleanup EXIT
      READY=0
      for i in $(seq 1 20); do
        sleep 3
        HTTP=$(curl -sf --connect-timeout 5 \
          -o /dev/null -w "%{http_code}" \
          -H "Authorization: Token $TOKEN" \
          "http://localhost:${PORT}/api/v2/users/" 2>/dev/null || echo "000")
        if [ "$HTTP" = "200" ]; then READY=1; break; fi
      done
      curl -s --connect-timeout 30 \
        -X POST "http://localhost:${PORT}/api/v2/import-scan/" \
        -H "Authorization: Token $TOKEN" \
        -F "scan_type=Trivy Scan" \
        -F "engagement=$ENGAGEMENT_ID" \
        -F "test_title=${IMAGE}" \
        -F "file=@${JSON_FILE}" \
        -F "active=true" \
        -F "verified=false" \
        -F "minimum_severity=High" \
        -o /tmp/import_out.json 2>/dev/null
      python3 -c "
      import json, sys
      try:
          d = json.load(open('/tmp/import_out.json'))
          s = d.get('statistics', {}).get('after', {})
          test_id = d.get('test_id', '?')
          critical = s.get('critical', {}).get('total', 0)
          high = s.get('high', {}).get('total', 0)
          print('OK test_id:' + str(test_id) + ' CRITICAL:' + str(critical) + ' HIGH:' + str(high))
      except Exception as e:
          print('Import done: $IMAGE')
      " 2>/dev/null || echo "Import done: $IMAGE"
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  when: dojo_token_final != ''

- name: Import Trivy JSON reports into DefectDojo
  command: >
    /tmp/dojo_import.sh
    {{ dojo_token_final }}
    {{ dojo_engagement_id }}
    /tmp/trivy-reports/{{ item | regex_replace('[/:@]', '_') }}.json
    {{ item }}
    {{ django_pod_name.stdout | trim }}
  loop: "{{ cluster_images_raw.stdout_lines | default([]) }}"
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: dojo_import_results
  changed_when: false
  ignore_errors: true
  when:
    - dojo_token_final != ''
    - dojo_engagement_id != ''
    - django_pod_name.stdout | default('') | trim != ''
    - cluster_images_raw.stdout_lines | default([]) | length > 0

- name: Display import results
  debug:
    msg: "{{ item.item | default('') }} - {{ item.stdout | default('skipped') }}"
  loop: "{{ dojo_import_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('') }}"
  run_once: true
  when:
    - dojo_import_results is defined
    - dojo_import_results.results | default([]) | length > 0
    - not item.skipped | default(false)

# ══════════════════════════════════════════════════════════════════════════════
# HTML REPORT
# ══════════════════════════════════════════════════════════════════════════════

- name: Deploy HTML report generator script
  copy:
    dest: /tmp/trivy_html_report.py
    mode: "0755"
    force: true
    content: |
      import json, os
      from datetime import datetime
      reports_dir = "/tmp/trivy-reports"
      output_file = "/tmp/trivy-report.html"
      all_results = []
      total_critical = 0
      total_high = 0
      images_scanned = 0
      for fname in sorted(os.listdir(reports_dir)):
          if not fname.endswith(".json"):
              continue
          fpath = os.path.join(reports_dir, fname)
          try:
              with open(fpath) as f:
                  data = json.load(f)
          except Exception:
              continue
          image_name = data.get("ArtifactName", fname.replace(".json", ""))
          images_scanned += 1
          image_vulns = []
          for r in data.get("Results", []):
              for v in r.get("Vulnerabilities") or []:
                  sev = v.get("Severity", "?")
                  if sev == "CRITICAL":
                      total_critical += 1
                  elif sev == "HIGH":
                      total_high += 1
                  image_vulns.append({
                      "severity": sev,
                      "cve": v.get("VulnerabilityID", "?"),
                      "package": v.get("PkgName", "?"),
                      "installed": v.get("InstalledVersion", "?"),
                      "fixed": v.get("FixedVersion", "N/A"),
                      "title": v.get("Title", ""),
                  })
          all_results.append({"image": image_name, "vulns": image_vulns})
      rows = ""
      for res in all_results:
          image = res["image"]
          if not res["vulns"]:
              rows += '<tr><td colspan="7" class="no-vuln">No HIGH/CRITICAL: ' + image + '</td></tr>'
              continue
          for i, v in enumerate(res["vulns"]):
              sev_class = "critical" if v["severity"] == "CRITICAL" else "high"
              img_cell = '<td rowspan="' + str(len(res["vulns"])) + '" class="image-cell">' + image + '</td>' if i == 0 else ""
              rows += (
                  '<tr class="' + sev_class + '">'
                  + img_cell
                  + '<td><span class="badge ' + sev_class + '">' + v["severity"] + '</span></td>'
                  + '<td><a href="https://nvd.nist.gov/vuln/detail/' + v["cve"] + '" target="_blank">' + v["cve"] + '</a></td>'
                  + '<td>' + v["package"] + '</td>'
                  + '<td>' + v["installed"] + '</td>'
                  + '<td>' + (v["fixed"] or "N/A") + '</td>'
                  + '<td>' + v["title"] + '</td>'
                  + '</tr>'
              )
      html = """<!DOCTYPE html><html lang="fr"><head>
      <meta charset="UTF-8"><title>Trivy Security Report</title>
      <style>
      body{font-family:Arial,sans-serif;background:#0f1117;color:#e0e0e0;margin:0;padding:20px}
      h1{color:#fff;text-align:center}
      .stats{display:flex;gap:20px;justify-content:center;margin-bottom:30px;flex-wrap:wrap}
      .stat-box{background:#1e2130;border-radius:10px;padding:20px 40px;text-align:center}
      .stat-box .number{font-size:2.5em;font-weight:bold}
      .stat-box.critical .number{color:#ff4d4d}
      .stat-box.high .number{color:#ff9900}
      .stat-box.total .number{color:#4dabf7}
      table{width:100%;border-collapse:collapse;background:#1e2130;border-radius:10px;overflow:hidden}
      th{padding:12px 15px;text-align:left;font-size:.85em;color:#aaa;text-transform:uppercase;background:#2a2d3e}
      td{padding:10px 15px;border-bottom:1px solid #2a2d3e;font-size:.88em;vertical-align:top}
      .image-cell{font-weight:bold;color:#4dabf7;font-size:.8em;word-break:break-all;max-width:200px}
      .badge{padding:3px 8px;border-radius:4px;font-size:.8em;font-weight:bold}
      .badge.critical{background:#ff4d4d22;color:#ff4d4d;border:1px solid #ff4d4d}
      .badge.high{background:#ff990022;color:#ff9900;border:1px solid #ff9900}
      a{color:#4dabf7;text-decoration:none}
      .no-vuln{color:#4caf50;text-align:center;padding:15px}
      .filter-bar{margin-bottom:15px;display:flex;gap:10px}
      .filter-bar input{background:#1e2130;border:1px solid #333;color:#fff;padding:8px 12px;border-radius:6px;width:300px}
      .filter-bar button{background:#2a2d3e;border:1px solid #444;color:#fff;padding:8px 15px;border-radius:6px;cursor:pointer}
      .filter-bar button.active{background:#ff4d4d33;border-color:#ff4d4d;color:#ff4d4d}
      </style></head><body>
      <h1>Trivy Security Report</h1>
      <div class="stats">
      <div class="stat-box total"><div class="number">""" + str(images_scanned) + """</div><div class="label">Images</div></div>
      <div class="stat-box critical"><div class="number">""" + str(total_critical) + """</div><div class="label">CRITICAL</div></div>
      <div class="stat-box high"><div class="number">""" + str(total_high) + """</div><div class="label">HIGH</div></div>
      <div class="stat-box total"><div class="number">""" + str(total_critical + total_high) + """</div><div class="label">Total</div></div>
      </div>
      <div class="filter-bar">
      <input type="text" id="searchInput" placeholder="Search CVE, package..." onkeyup="filterTable()">
      <button onclick="filterSeverity('ALL')" class="active" id="btn-ALL">All</button>
      <button onclick="filterSeverity('CRITICAL')" id="btn-CRITICAL">Critical</button>
      <button onclick="filterSeverity('HIGH')" id="btn-HIGH">High</button>
      </div>
      <table id="vulnTable"><thead><tr>
      <th>Image</th><th>Severity</th><th>CVE</th><th>Package</th><th>Installed</th><th>Fixed In</th><th>Description</th>
      </tr></thead><tbody>""" + rows + """</tbody></table>
      <script>
      var currentFilter="ALL";
      function filterTable(){
        var q=document.getElementById("searchInput").value.toLowerCase();
        document.querySelectorAll("#vulnTable tbody tr").forEach(function(row){
          var text=row.innerText.toLowerCase();
          var sevMatch=currentFilter==="ALL"||text.includes(currentFilter.toLowerCase());
          row.style.display=(text.includes(q)&&sevMatch)?"":"none";
        });
      }
      function filterSeverity(sev){
        currentFilter=sev;
        ["ALL","CRITICAL","HIGH"].forEach(function(s){
          document.getElementById("btn-"+s).classList.toggle("active",s===sev);
        });
        filterTable();
      }
      </script></body></html>"""
      with open(output_file, "w") as f:
          f.write(html)
      print(output_file)
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Generate HTML report
  command: python3 /tmp/trivy_html_report.py
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: html_report_path
  changed_when: false
  ignore_errors: true

- name: Confirm HTML report generated
  debug:
    msg: "Rapport HTML : {{ html_report_path.stdout }}"
  run_once: true


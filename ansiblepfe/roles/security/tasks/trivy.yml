---
# ══════════════════════════════════════════════════════════════════════════════
# TRIVY - INSTALLATION & SCAN
# ══════════════════════════════════════════════════════════════════════════════

- name: Set default Trivy version
  set_fact:
    trivy_version: "{{ trivy_version | default('0.57.0') }}"
  run_once: true

- name: Check if Trivy is already installed
  command: /usr/local/bin/trivy version
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: trivy_installed
  changed_when: false
  failed_when: false
  ignore_errors: true

- name: Display Trivy installation status
  debug:
    msg: >-
      {% if trivy_installed.rc == 0 %}
      Trivy deja installe ({{ trivy_installed.stdout_lines[0] }})
      {% else %}
      Trivy pas trouve - telechargement et installation...
      {% endif %}
  run_once: true

- name: Download Trivy binary (if not installed)
  get_url:
    url: "https://github.com/aquasecurity/trivy/releases/download/v{{ trivy_version }}/trivy_{{ trivy_version }}_linux-64bit.tar.gz"
    dest: /tmp/trivy.tar.gz
    timeout: 300
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  when: trivy_installed.rc != 0
  ignore_errors: true

- name: Extract Trivy binary (if not installed)
  unarchive:
    src: /tmp/trivy.tar.gz
    dest: /usr/local/bin/
    remote_src: true
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  when: trivy_installed.rc != 0
  ignore_errors: true

- name: Verify Trivy installation after setup
  command: /usr/local/bin/trivy version
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: trivy_check
  changed_when: false
  ignore_errors: true

- name: Confirm Trivy is ready
  debug:
    msg: "Trivy {{ trivy_check.stdout_lines[0] }} is ready"
  run_once: true

- name: Create Trivy cache directory
  file:
    path: "/root/.cache/trivy/db"
    state: directory
    mode: "0755"
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Check if Trivy DB already exists and is recent (< 24h)
  shell: |
    DB_PATH="/root/.cache/trivy/db/metadata.json"
    if [ -f "$DB_PATH" ]; then
      MOD_TIME=$(stat -c %Y "$DB_PATH")
      NOW=$(date +%s)
      AGE=$((NOW - MOD_TIME))
      MAX_AGE=$((24 * 3600))
      if [ $AGE -lt $MAX_AGE ]; then
        echo "SKIP"
      else
        echo "UPDATE"
      fi
    else
      echo "MISSING"
    fi
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: db_check
  changed_when: false

- name: Display DB status
  debug:
    msg: "Trivy DB status: {{ db_check.stdout | trim }}"
  run_once: true

- name: Download Trivy vulnerability database
  shell: /usr/local/bin/trivy image --download-db-only
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  timeout: 300
  changed_when: true
  when: db_check.stdout | trim != "SKIP"
  ignore_errors: true

- name: Download Trivy Java database
  shell: /usr/local/bin/trivy image --download-java-db-only
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  timeout: 300
  changed_when: true
  when: db_check.stdout | trim != "SKIP"
  ignore_errors: true

- name: Display DB download completion status
  debug:
    msg: "Trivy DBs status: {{ 'up to date - skipped' if db_check.stdout | trim == 'SKIP' else 'downloaded successfully' }}"
  run_once: true

- name: Verify Trivy DBs
  shell: |
    echo "=== Vuln DB ===" && ls -lh /root/.cache/trivy/db/
    echo "=== Java DB ===" && ls -lh /root/.cache/trivy/javadb/ 2>/dev/null || echo "Java DB not found"
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: trivy_db_verify
  changed_when: false

- name: Display Trivy DB verification
  debug:
    msg: "{{ trivy_db_verify.stdout_lines }}"
  run_once: true

- name: Get all running images in cluster
  shell: |
    kubectl get pods -A \
      -o jsonpath='{range .items[*]}{range .spec.containers[*]}{.image}{"\n"}{end}{range .spec.initContainers[*]}{.image}{"\n"}{end}{end}' \
      | sort -u | grep -v '^$'
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: cluster_images_raw
  changed_when: false
  ignore_errors: true

- name: Display images found in cluster
  debug:
    msg: "Images trouvees : {{ cluster_images_raw.stdout_lines }}"
  run_once: true

# ══════════════════════════════════════════════════════════════════════════════
# TRIVY SCAN
# ══════════════════════════════════════════════════════════════════════════════

- name: Create Trivy reports directory
  file:
    path: /tmp/trivy-reports
    state: directory
    mode: "0755"
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Scan all cluster images with Trivy
  shell: |
    IMAGE="{{ item }}"
    SAFE_NAME=$(echo "$IMAGE" | tr '/:@' '_')
    echo "Scanning: $IMAGE"
    /usr/local/bin/trivy image --severity HIGH,CRITICAL --no-progress \
      --skip-db-update --skip-java-db-update --offline-scan --scanners vuln \
      --format table --timeout 5m "$IMAGE" 2>&1 || true
    /usr/local/bin/trivy image --severity HIGH,CRITICAL --no-progress \
      --skip-db-update --skip-java-db-update --offline-scan --scanners vuln \
      --format json --output /tmp/trivy-reports/${SAFE_NAME}.json \
      --timeout 5m "$IMAGE" 2>/dev/null || true
    /usr/local/bin/trivy image --severity HIGH,CRITICAL --no-progress \
      --skip-db-update --skip-java-db-update --offline-scan --scanners vuln \
      --format sarif --output /tmp/trivy-reports/${SAFE_NAME}.sarif \
      --timeout 5m "$IMAGE" 2>/dev/null || true
    echo "--- END: $IMAGE ---"
  loop: "{{ cluster_images_raw.stdout_lines | default([]) }}"
  register: trivy_scan_results
  changed_when: false
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  ignore_errors: true
  when: cluster_images_raw.stdout_lines | default([]) | length > 0

- name: List all generated Trivy reports
  shell: ls -lh /tmp/trivy-reports/
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: trivy_reports_list
  changed_when: false
  ignore_errors: true

- name: Display list of generated reports
  debug:
    msg: "{{ trivy_reports_list.stdout_lines }}"
  run_once: true

- name: Deploy Trivy report parser script
  copy:
    dest: /tmp/trivy_parse.py
    mode: "0755"
    force: true
    content: |
      import json, sys
      json_file = sys.argv[1]
      with open(json_file) as f:
          data = json.load(f)
      results = data.get('Results', [])
      if not results:
          print('  No vulnerabilities found.')
          sys.exit(0)
      total_critical = 0
      total_high = 0
      for r in results:
          target = r.get('Target', 'unknown')
          vulns = r.get('Vulnerabilities') or []
          if not vulns:
              continue
          print('\n  Target : ' + target)
          print('  Vulns  : ' + str(len(vulns)))
          print('  ' + '-'*60)
          for v in vulns:
              sev = v.get('Severity', '?')
              cve = v.get('VulnerabilityID', '?')
              pkg = v.get('PkgName', '?')
              installed = v.get('InstalledVersion', '?')
              fixed = v.get('FixedVersion', 'No fix available')
              title = v.get('Title', '')
              print('  [' + sev + '] ' + cve)
              print('         Package  : ' + pkg + ' ' + installed)
              print('         Fixed in : ' + fixed)
              if title:
                  print('         Title    : ' + title)
              if sev == 'CRITICAL':
                  total_critical += 1
              elif sev == 'HIGH':
                  total_high += 1
      print('')
      print('  TOTAL CRITICAL : ' + str(total_critical))
      print('  TOTAL HIGH     : ' + str(total_high))
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Read and display Trivy JSON reports
  shell: |
    IMAGE="{{ item }}"
    SAFE_NAME=$(echo "$IMAGE" | tr '/:@' '_')
    JSON_FILE="/tmp/trivy-reports/${SAFE_NAME}.json"
    if [ ! -f "$JSON_FILE" ]; then
      echo "No report found for: $IMAGE"
      exit 0
    fi
    echo "========================================"
    echo "Image: $IMAGE"
    echo "========================================"
    python3 /tmp/trivy_parse.py "$JSON_FILE" || echo "Could not parse: $JSON_FILE"
    echo "========================================"
  loop: "{{ cluster_images_raw.stdout_lines | default([]) }}"
  register: trivy_report_display
  changed_when: false
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  ignore_errors: true
  when: cluster_images_raw.stdout_lines | default([]) | length > 0

- name: Display Trivy reports content
  debug:
    msg: "{{ item.stdout_lines }}"
  loop: "{{ trivy_report_display.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  run_once: true
  when:
    - trivy_report_display.results | default([]) | length > 0
    - item.stdout_lines | default([]) | length > 0

# ══════════════════════════════════════════════════════════════════════════════
# STORAGECLASS
# ══════════════════════════════════════════════════════════════════════════════

- name: Check if local-path StorageClass exists
  shell: kubectl get storageclass local-path 2>/dev/null | grep -c local-path || true
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: storageclass_exists
  changed_when: false

- name: Install local-path-provisioner if needed
  block:
    - name: Download local-path manifest
      get_url:
        url: https://raw.githubusercontent.com/rancher/local-path-provisioner/master/deploy/local-path-storage.yaml
        dest: /tmp/local-path-storage.yaml
      when: storageclass_exists.stdout | trim == "0"

    - name: Apply local-path-provisioner
      command: kubectl apply -f /tmp/local-path-storage.yaml
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      when: storageclass_exists.stdout | trim == "0"

    - name: Set local-path as default StorageClass
      shell: |
        kubectl patch storageclass local-path \
          -p '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      when: storageclass_exists.stdout | trim == "0"
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

# ══════════════════════════════════════════════════════════════════════════════
# FIX HA POSTGRESQL — Réduction du temps de recovery nœud mort
# ══════════════════════════════════════════════════════════════════════════════

- name: "[HA-PG-FIX] Patch kube-controller-manager pour accélérer node eviction"
  shell: |
    MANIFEST="/etc/kubernetes/manifests/kube-controller-manager.yaml"
    if [ ! -f "$MANIFEST" ]; then
      echo "Manifest non trouve — skip (cluster non kubeadm ?)"
      exit 0
    fi
    if grep -q "node-monitor-grace-period=20s" "$MANIFEST"; then
      echo "Deja patche — skip"
      exit 0
    fi
    echo "→ Backup du manifest..."
    cp "$MANIFEST" "${MANIFEST}.bak.$(date +%Y%m%d%H%M%S)"
    echo "→ Application du patch..."
    python3 - <<'PYEOF'
    import yaml
    with open('/etc/kubernetes/manifests/kube-controller-manager.yaml', 'r') as f:
        manifest = yaml.safe_load(f)
    containers = manifest['spec']['containers']
    for c in containers:
        if 'kube-controller-manager' in c.get('name', ''):
            cmd = c.get('command', [])
            cmd = [x for x in cmd if not any(k in x for k in [
                'node-monitor-grace-period',
                'node-monitor-period',
                'pod-eviction-timeout'
            ])]
            cmd.extend([
                '--node-monitor-period=5s',
                '--node-monitor-grace-period=20s',
                '--pod-eviction-timeout=30s',
            ])
            c['command'] = cmd
            break
    with open('/etc/kubernetes/manifests/kube-controller-manager.yaml', 'w') as f:
        yaml.dump(manifest, f, default_flow_style=False)
    print("Patch applique")
    PYEOF
    echo "✓ kube-controller-manager patche"
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: kcm_patch_result
  changed_when: "'patche' in kcm_patch_result.stdout"
  ignore_errors: true

- name: "[HA-PG-FIX] Afficher résultat patch kube-controller-manager"
  debug:
    msg: "{{ kcm_patch_result.stdout_lines }}"
  run_once: true

- name: "[HA-PG-FIX] Attendre redémarrage kube-controller-manager"
  shell: |
    for i in $(seq 1 30); do
      STATUS=$(kubectl get pod -n kube-system \
        -l component=kube-controller-manager \
        -o jsonpath='{.items[0].status.phase}' 2>/dev/null || echo "")
      echo "Attempt $i — status: ${STATUS:-not found}"
      if [ "$STATUS" = "Running" ]; then
        echo "✓ kube-controller-manager Running"
        exit 0
      fi
      sleep 5
    done
    echo "⚠ Timeout (non bloquant)"
    exit 0
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: kcm_wait
  changed_when: false
  ignore_errors: true
  when: kcm_patch_result.changed

- name: "[HA-PG-FIX] Afficher statut kube-controller-manager"
  debug:
    msg: "{{ kcm_wait.stdout_lines | default(['Skip — pas de changement']) }}"
  run_once: true

# ══════════════════════════════════════════════════════════════════════════════
# DEFECTDOJO - SECRETS & NAMESPACE
# ══════════════════════════════════════════════════════════════════════════════

- name: Create DefectDojo namespace
  shell: kubectl create namespace defectdojo --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  ignore_errors: true

- name: Add DefectDojo Helm repository
  command: helm repo add defectdojo https://raw.githubusercontent.com/DefectDojo/django-DefectDojo/helm-charts
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  ignore_errors: true

- name: Update Helm repositories
  command: helm repo update
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Get Valkey password
  shell: |
    kubectl get secret defectdojo-valkey-specific -n defectdojo \
      -o jsonpath='{.data.valkey-password}' 2>/dev/null | base64 --decode || echo ""
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: valkey_secret_password
  changed_when: false
  no_log: true

- name: Set Valkey password fact
  set_fact:
    valkey_password: "{{ valkey_secret_password.stdout | trim }}"
  no_log: true

- name: Generate DefectDojo secrets if not exist
  shell: |
    SECRET_EXISTS=$(kubectl get secret defectdojo -n defectdojo \
      --ignore-not-found -o name 2>/dev/null)
    if [ -n "$SECRET_EXISTS" ]; then
      echo "Secrets already exist - skipping"
      exit 0
    fi
    echo "Creating secrets..."
    DD_ADMIN_PASS=$(openssl rand -base64 16 | tr -d '=+/' | cut -c1-16)
    PG_PASS=$(openssl rand -base64 16 | tr -d '=+/' | cut -c1-16)
    VALKEY_PASS=$(openssl rand -base64 16 | tr -d '=+/' | cut -c1-16)
    DD_SECRET_KEY=$(openssl rand -base64 32)
    kubectl create secret generic defectdojo \
      --namespace defectdojo \
      --from-literal=DD_ADMIN_PASSWORD="$DD_ADMIN_PASS" \
      --from-literal=DD_SECRET_KEY="$DD_SECRET_KEY" \
      --from-literal=DD_DATABASE_PASSWORD="$PG_PASS"
    kubectl create secret generic defectdojo-postgresql-specific \
      --namespace defectdojo \
      --from-literal=postgresql-password="$PG_PASS" \
      --from-literal=postgresql-postgres-password="$PG_PASS"
    kubectl create secret generic defectdojo-valkey-specific \
      --namespace defectdojo \
      --from-literal=valkey-password="$VALKEY_PASS"
    echo "Secrets created - admin password: $DD_ADMIN_PASS"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: secret_creation
  changed_when: "'Creating secrets' in secret_creation.stdout"

- name: Display secret creation result
  debug:
    msg: "{{ secret_creation.stdout_lines }}"
  run_once: true

# ══════════════════════════════════════════════════════════════════════════════
# HA-PG : MIGRATION POSTGRESQL → NFS
# ══════════════════════════════════════════════════════════════════════════════

- name: "[HA-PG] Vérifier StorageClass actuelle de PostgreSQL"
  shell: |
    kubectl get pvc data-defectdojo-postgresql-0 -n defectdojo \
      -o jsonpath='{.spec.storageClassName}' 2>/dev/null || echo "not_found"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: pg_current_sc
  changed_when: false

- name: "[HA-PG] Afficher StorageClass PostgreSQL actuelle"
  debug:
    msg: "PostgreSQL StorageClass : {{ pg_current_sc.stdout | trim }}"
  run_once: true

- name: "[HA-PG] Backup PostgreSQL avant migration NFS"
  shell: |
    SC="{{ pg_current_sc.stdout | trim }}"
    if [ "$SC" = "nfs" ]; then
      echo "Deja sur NFS — backup non necessaire"
      exit 0
    fi
    PG_POD=$(kubectl get pod -n defectdojo -l app.kubernetes.io/name=postgresql \
      --no-headers -o custom-columns=':metadata.name' 2>/dev/null | head -1)
    if [ -z "$PG_POD" ]; then
      echo "Aucun pod PostgreSQL — skip backup (premiere installation)"
      exit 0
    fi
    READY=$(kubectl get pod $PG_POD -n defectdojo \
      -o jsonpath='{.status.containerStatuses[0].ready}' 2>/dev/null || echo "false")
    if [ "$READY" != "true" ]; then
      echo "Pod non pret ($READY) — skip backup"
      exit 0
    fi
    PGPASS=$(kubectl get secret defectdojo-postgresql-specific -n defectdojo \
      -o jsonpath='{.data.postgresql-password}' 2>/dev/null | base64 --decode || echo "")
    BACKUP_FILE="/tmp/defectdojo-pg-backup-$(date +%Y%m%d-%H%M%S).sql"
    echo "→ Backup depuis $PG_POD vers $BACKUP_FILE ..."
    kubectl exec -n defectdojo $PG_POD -- \
      env PGPASSWORD="$PGPASS" pg_dump -U defectdojo defectdojo \
      > "$BACKUP_FILE" 2>/dev/null
    LINES=$(wc -l < "$BACKUP_FILE" 2>/dev/null || echo "0")
    echo "✓ Backup termine : $LINES lignes → $BACKUP_FILE"
    echo "BACKUP_FILE=$BACKUP_FILE"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: pg_backup_result
  changed_when: false
  ignore_errors: true

- name: "[HA-PG] Afficher résultat backup"
  debug:
    msg: "{{ pg_backup_result.stdout_lines }}"
  run_once: true

- name: "[HA-PG] Enregistrer chemin du backup"
  set_fact:
    pg_backup_file: >-
      {{ pg_backup_result.stdout_lines
         | select('match', '^BACKUP_FILE=.*')
         | list | last | default('') | regex_replace('^BACKUP_FILE=', '') }}
  run_once: true

- name: "[HA-PG] Définir NFS comme StorageClass par défaut"
  shell: |
    SC="{{ pg_current_sc.stdout | trim }}"
    if [ "$SC" = "nfs" ]; then
      echo "PostgreSQL deja sur NFS — skip"
      exit 0
    fi
    echo "→ Retirer default de local-path..."
    kubectl patch storageclass local-path \
      -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"false"}}}' \
      2>/dev/null || true
    echo "→ Definir nfs comme StorageClass par defaut..."
    kubectl patch storageclass nfs \
      -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}' \
      2>/dev/null || true
    echo "✓ NFS est maintenant le StorageClass par defaut"
    kubectl get storageclass
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: sc_default_result
  changed_when: "'NFS est maintenant' in sc_default_result.stdout"
  ignore_errors: true
  when: pg_current_sc.stdout | trim != 'nfs'

- name: "[HA-PG] Afficher StorageClass par défaut"
  debug:
    msg: "{{ sc_default_result.stdout_lines | default(['Skip — deja NFS']) }}"
  run_once: true

- name: "[HA-PG] Supprimer StatefulSet + PVC local-path"
  shell: |
    SC="{{ pg_current_sc.stdout | trim }}"
    if [ "$SC" = "nfs" ]; then
      echo "Deja sur NFS — skip suppression"
      exit 0
    fi
    if [ "$SC" = "not_found" ]; then
      echo "Aucun PVC existant — premiere installation"
      exit 0
    fi
    echo "→ Scale down PostgreSQL a 0"
    kubectl scale statefulset defectdojo-postgresql \
      -n defectdojo --replicas=0 2>/dev/null || true
    echo "→ Attente arret pod PostgreSQL..."
    for i in $(seq 1 30); do
      COUNT=$(kubectl get pods -n defectdojo \
        -l app.kubernetes.io/name=postgresql \
        --no-headers 2>/dev/null | grep -v Terminating | wc -l)
      echo "  Attempt $i - pods running: $COUNT"
      [ "$COUNT" = "0" ] && break
      sleep 3
    done
    echo "→ Suppression StatefulSet (cascade=orphan)"
    kubectl delete statefulset defectdojo-postgresql -n defectdojo \
      --cascade=orphan --ignore-not-found=true
    echo "→ Suppression PVC local-path avec patch finalizer"
    kubectl patch pvc data-defectdojo-postgresql-0 -n defectdojo \
      -p '{"metadata":{"finalizers":[]}}' \
      --type=merge 2>/dev/null || true
    kubectl delete pvc data-defectdojo-postgresql-0 -n defectdojo \
      --force --grace-period=0 --ignore-not-found=true
    echo "→ Attente suppression PVC complete..."
    for i in $(seq 1 20); do
      EXISTS=$(kubectl get pvc data-defectdojo-postgresql-0 \
        -n defectdojo --ignore-not-found 2>/dev/null | wc -l)
      echo "  Attempt $i - PVC lines: $EXISTS"
      [ "$EXISTS" = "0" ] && echo "✓ PVC supprime" && break
      sleep 2
    done
    echo "✓ Nettoyage termine"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: pg_cleanup_result
  changed_when: "'Nettoyage termine' in pg_cleanup_result.stdout"
  ignore_errors: true

- name: "[HA-PG] Afficher résultat nettoyage"
  debug:
    msg: "{{ pg_cleanup_result.stdout_lines }}"
  run_once: true

# ══════════════════════════════════════════════════════════════════════════════
# HA-VALKEY : MIGRATION VALKEY → NFS
# ══════════════════════════════════════════════════════════════════════════════

- name: "[HA-VALKEY] Vérifier StorageClass actuelle de Valkey"
  shell: |
    SC0=$(kubectl get pvc data-defectdojo-valkey-0 -n defectdojo \
      -o jsonpath='{.spec.storageClassName}' 2>/dev/null || echo "not_found")
    SC1=$(kubectl get pvc data-defectdojo-valkey-1 -n defectdojo \
      -o jsonpath='{.spec.storageClassName}' 2>/dev/null || echo "not_found")
    SC2=$(kubectl get pvc data-defectdojo-valkey-2 -n defectdojo \
      -o jsonpath='{.spec.storageClassName}' 2>/dev/null || echo "not_found")
    echo "valkey-0=$SC0 valkey-1=$SC1 valkey-2=$SC2"
    if [ "$SC0" = "nfs" ] && [ "$SC1" = "nfs" ] && [ "$SC2" = "nfs" ]; then
      echo "STATUS=nfs"
    else
      echo "STATUS=local-path"
    fi
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: valkey_current_sc
  changed_when: false

- name: "[HA-VALKEY] Afficher StorageClass Valkey actuelle"
  debug:
    msg: "{{ valkey_current_sc.stdout_lines }}"
  run_once: true

- name: "[HA-VALKEY] Scale down DefectDojo avant migration Valkey"
  shell: |
    if echo "{{ valkey_current_sc.stdout }}" | grep -q "STATUS=nfs"; then
      echo "Valkey deja sur NFS — skip scale down"
      exit 0
    fi
    echo "→ Scale down Django, Celery worker et beat..."
    kubectl scale deployment defectdojo-django \
      -n defectdojo --replicas=0 2>/dev/null || true
    kubectl scale deployment defectdojo-celery-worker \
      -n defectdojo --replicas=0 2>/dev/null || true
    kubectl scale deployment defectdojo-celery-beat \
      -n defectdojo --replicas=0 2>/dev/null || true
    echo "→ Attente arret des pods..."
    for i in $(seq 1 30); do
      COUNT=$(kubectl get pods -n defectdojo --no-headers 2>/dev/null \
        | grep -E "django|celery" | grep -v Terminating | wc -l)
      echo "  Attempt $i - pods django/celery encore running: $COUNT"
      [ "$COUNT" = "0" ] && break
      sleep 3
    done
    echo "✓ Scale down termine"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: valkey_scaledown_result
  changed_when: "'Scale down termine' in valkey_scaledown_result.stdout"
  ignore_errors: true

- name: "[HA-VALKEY] Afficher résultat scale down"
  debug:
    msg: "{{ valkey_scaledown_result.stdout_lines }}"
  run_once: true

- name: "[HA-VALKEY] Supprimer StatefulSet + PVC Valkey local-path"
  shell: |
    if echo "{{ valkey_current_sc.stdout }}" | grep -q "STATUS=nfs"; then
      echo "Valkey deja sur NFS — skip suppression"
      exit 0
    fi
    echo "→ Suppression StatefulSet Valkey (cascade=orphan)..."
    kubectl delete statefulset defectdojo-valkey -n defectdojo \
      --cascade=orphan --ignore-not-found=true 2>/dev/null || true
    echo "→ Suppression pods Valkey..."
    kubectl delete pod defectdojo-valkey-0 defectdojo-valkey-1 defectdojo-valkey-2 \
      -n defectdojo --force --grace-period=0 --ignore-not-found=true 2>/dev/null || true
    echo "→ Suppression PVC Valkey local-path..."
    for i in 0 1 2; do
      kubectl patch pvc data-defectdojo-valkey-$i -n defectdojo \
        -p '{"metadata":{"finalizers":[]}}' --type=merge 2>/dev/null || true
      kubectl delete pvc data-defectdojo-valkey-$i -n defectdojo \
        --force --grace-period=0 --ignore-not-found=true 2>/dev/null || true
    done
    echo "→ Attente suppression PVC complete..."
    for i in $(seq 1 20); do
      COUNT=$(kubectl get pvc -n defectdojo 2>/dev/null \
        | grep valkey | grep -v nfs | wc -l)
      echo "  Attempt $i - PVC local-path restants: $COUNT"
      [ "$COUNT" = "0" ] && echo "✓ Tous PVC Valkey supprimes" && break
      sleep 3
    done
    echo "✓ Nettoyage Valkey termine"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: valkey_cleanup_result
  changed_when: "'Nettoyage Valkey termine' in valkey_cleanup_result.stdout"
  ignore_errors: true

- name: "[HA-VALKEY] Afficher résultat nettoyage Valkey"
  debug:
    msg: "{{ valkey_cleanup_result.stdout_lines }}"
  run_once: true

- name: "[HA-VALKEY] Définir NFS comme StorageClass par défaut temporairement"
  shell: |
    kubectl patch storageclass local-path \
      -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"false"}}}' \
      2>/dev/null || true
    kubectl patch storageclass nfs \
      -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}' \
      2>/dev/null || true
    echo "✓ NFS defini comme StorageClass par defaut"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  when: valkey_current_sc.stdout is not search('STATUS=nfs')

# ══════════════════════════════════════════════════════════════════════════════
# DEFECTDOJO HELM INSTALL
# ══════════════════════════════════════════════════════════════════════════════

- name: Create Helm values file with sentinel broker config and PG tolerations
  copy:
    dest: /tmp/dojo-values.yaml
    mode: "0600"
    force: true
    content: |
      extraConfig:
        DD_CELERY_BROKER_HOST: "defectdojo-valkey-sentinel"
        DD_CELERY_BROKER_PORT: "26379"
        DD_CELERY_BROKER_PATH: "/0"
        DD_CELERY_BROKER_PARAMS: ""
        DD_CELERY_BROKER_SCHEME: "sentinel"
        DD_CELERY_BROKER_TRANSPORT_OPTIONS: '{"master_name": "mymaster", "sentinel_kwargs": {"password": "{{ valkey_password }}"}}'

      postgresql:
        primary:
          tolerations:
            - key: "node.kubernetes.io/not-ready"
              operator: "Exists"
              effect: "NoExecute"
              tolerationSeconds: 30
            - key: "node.kubernetes.io/unreachable"
              operator: "Exists"
              effect: "NoExecute"
              tolerationSeconds: 30

      celery:
        beat:
          # ⚠ 2 replicas — risque de doublons de tâches planifiées
          replicaCount: 1
          tolerations:
            - key: "node.kubernetes.io/not-ready"
              operator: "Exists"
              effect: "NoExecute"
              tolerationSeconds: 30
            - key: "node.kubernetes.io/unreachable"
              operator: "Exists"
              effect: "NoExecute"
              tolerationSeconds: 30
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  no_log: true

- name: "[HA-VALKEY] Supprimer PVC Valkey local-path avant Helm install"
  shell: |
    SC0=$(kubectl get pvc data-defectdojo-valkey-0 -n defectdojo \
      -o jsonpath='{.spec.storageClassName}' 2>/dev/null || echo "not_found")
    if [ "$SC0" = "nfs" ]; then
      echo "Valkey deja sur NFS — skip"
      exit 0
    fi
    echo "→ Scale down Django et Celery..."
    kubectl scale deployment defectdojo-django -n defectdojo --replicas=0 2>/dev/null || true
    kubectl scale deployment defectdojo-celery-worker -n defectdojo --replicas=0 2>/dev/null || true
    kubectl scale deployment defectdojo-celery-beat -n defectdojo --replicas=0 2>/dev/null || true
    echo "→ Attente arret pods..."
    for i in $(seq 1 30); do
      COUNT=$(kubectl get pods -n defectdojo --no-headers 2>/dev/null \
        | grep -E "django|celery" | grep -v Terminating | wc -l)
      echo "  Attempt $i - pods restants: $COUNT"
      [ "$COUNT" = "0" ] && break
      sleep 3
    done
    echo "→ Suppression StatefulSet Valkey (cascade=orphan)..."
    kubectl delete statefulset defectdojo-valkey -n defectdojo \
      --cascade=orphan --ignore-not-found=true 2>/dev/null || true
    echo "→ Suppression pods Valkey..."
    kubectl delete pod defectdojo-valkey-0 defectdojo-valkey-1 defectdojo-valkey-2 \
      -n defectdojo --force --grace-period=0 --ignore-not-found=true 2>/dev/null || true
    echo "→ Suppression PVC Valkey..."
    for i in 0 1 2; do
      kubectl patch pvc data-defectdojo-valkey-$i -n defectdojo \
        -p '{"metadata":{"finalizers":[]}}' --type=merge 2>/dev/null || true
      kubectl delete pvc data-defectdojo-valkey-$i -n defectdojo \
        --force --grace-period=0 --ignore-not-found=true 2>/dev/null || true
    done
    echo "→ Attente suppression complete..."
    for i in $(seq 1 20); do
      COUNT=$(kubectl get pvc -n defectdojo 2>/dev/null | grep valkey | wc -l)
      echo "  Attempt $i - PVC valkey restants: $COUNT"
      [ "$COUNT" = "0" ] && echo "✓ Tous PVC Valkey supprimes" && break
      sleep 3
    done
    echo "✓ Pret pour Helm install avec NFS"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: valkey_pre_helm_cleanup
  changed_when: "'Pret pour Helm install' in valkey_pre_helm_cleanup.stdout"
  ignore_errors: true

- name: "[HA-VALKEY] Restaurer local-path comme StorageClass par défaut"
  shell: |
    kubectl patch storageclass nfs \
      -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"false"}}}' \
      2>/dev/null || true
    kubectl patch storageclass local-path \
      -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}' \
      2>/dev/null || true
    echo "✓ local-path restaure comme StorageClass par defaut"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  when: valkey_current_sc.stdout is not search('STATUS=nfs')

- name: "[HA-VALKEY] Afficher résultat nettoyage pré-Helm"
  debug:
    msg: "{{ valkey_pre_helm_cleanup.stdout_lines }}"
  run_once: true

# ══════════════════════════════════════════════════════════════════════════════
# MODIFICATIONS : celery.beat.replicas=2 ajouté dans le helm upgrade
# ══════════════════════════════════════════════════════════════════════════════

- name: Install/Upgrade DefectDojo
  command: >
    helm upgrade --install defectdojo defectdojo/defectdojo
    --namespace defectdojo
    --values /tmp/dojo-values.yaml
    --set tag=2.59.0
    --set imagePullPolicy=IfNotPresent
    --set django.replicas=2
    --set django.resources.requests.cpu=250m
    --set django.resources.requests.memory=600Mi
    --set django.resources.limits.cpu=2
    --set django.resources.limits.memory=1500Mi
    --set django.uwsgi.resources.requests.memory=512Mi
    --set django.uwsgi.resources.limits.memory=1500Mi
    --set django.uwsgi.livenessProbe.initialDelaySeconds=300
    --set django.uwsgi.livenessProbe.failureThreshold=25
    --set django.uwsgi.livenessProbe.timeoutSeconds=10
    --set django.uwsgi.livenessProbe.periodSeconds=12
    --set django.nginx.resources.requests.memory=128Mi
    --set django.nginx.resources.limits.memory=256Mi
    --set django.nginx.startupProbe.failureThreshold=60
    --set django.nginx.startupProbe.periodSeconds=10
    --set django.nginx.startupProbe.timeoutSeconds=10
    --set django.nginx.readinessProbe.failureThreshold=10
    --set django.nginx.readinessProbe.timeoutSeconds=10
    --set django.nginx.readinessProbe.periodSeconds=10
    --set "django.env.DD_ALLOWED_HOSTS=defectdojo.default.minikube.local\,defectdojo.example.com\,localhost\,10.10.1.147\,127.0.0.1\,*"
    --set "django.env.DD_SESSION_COOKIE_SECURE=False"
    --set "django.env.DD_CSRF_COOKIE_SECURE=False"
    --set "django.env.DD_SECURE_SSL_REDIRECT=False"
    --set "django.env.DD_SECURE_HSTS_SECONDS=0"
    --set celery.worker.replicas=2
    --set celery.worker.resources.requests.memory=256Mi
    --set celery.worker.resources.limits.memory=1Gi
    --set celery.beat.replicas=1
    --set valkey.enabled=true
    --set valkey.architecture=replication
    --set valkey.replica.replicaCount=2
    --set valkey.sentinel.enabled=true
    --set valkey.sentinel.masterSet=mymaster
    --set valkey.sentinel.quorum=2
    --set valkey.sentinel.resources.requests.memory=64Mi
    --set valkey.sentinel.resources.limits.memory=128Mi
    --set valkey.master.resources.requests.memory=128Mi
    --set valkey.master.resources.limits.memory=512Mi
    --set valkey.replica.resources.requests.memory=128Mi
    --set valkey.replica.resources.limits.memory=512Mi
    --set valkey.master.persistence.storageClass=nfs
    --set valkey.master.persistence.size=8Gi
    --set valkey.replica.persistence.storageClass=nfs
    --set valkey.replica.persistence.size=8Gi
    --set valkey.master.tolerations[0].key=node.kubernetes.io/not-ready
    --set valkey.master.tolerations[0].operator=Exists
    --set valkey.master.tolerations[0].effect=NoExecute
    --set valkey.master.tolerations[0].tolerationSeconds=30
    --set valkey.master.tolerations[1].key=node.kubernetes.io/unreachable
    --set valkey.master.tolerations[1].operator=Exists
    --set valkey.master.tolerations[1].effect=NoExecute
    --set valkey.master.tolerations[1].tolerationSeconds=30
    --set valkey.replica.tolerations[0].key=node.kubernetes.io/not-ready
    --set valkey.replica.tolerations[0].operator=Exists
    --set valkey.replica.tolerations[0].effect=NoExecute
    --set valkey.replica.tolerations[0].tolerationSeconds=30
    --set valkey.replica.tolerations[1].key=node.kubernetes.io/unreachable
    --set valkey.replica.tolerations[1].operator=Exists
    --set valkey.replica.tolerations[1].effect=NoExecute
    --set valkey.replica.tolerations[1].tolerationSeconds=30
    --set postgresql.resources.requests.memory=256Mi
    --set postgresql.resources.limits.memory=1Gi
    --set postgresql.persistence.storageClass=nfs
    --set postgresql.persistence.size=8Gi
    --set createSecret=false
    --set createPostgresqlSecret=false
    --set createValkeySecret=false
    --set django.ingress.enabled=false
    --set django.serviceType=ClusterIP
    --timeout=35m
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: "[BROKER-FIX] Corriger immédiatement le ConfigMap broker après Helm install"
  shell: |
    CM=$(kubectl get configmap -n defectdojo -o json \
      | python3 -c "
    import json, sys
    cms = json.load(sys.stdin)['items']
    for cm in cms:
        if 'DD_CELERY_BROKER_PATH' in cm.get('data', {}):
            print(cm['metadata']['name'])
            break
    " 2>/dev/null || echo "")
    if [ -z "$CM" ]; then
      echo "ConfigMap non trouve - skip"
      exit 0
    fi
    CURRENT_HOST=$(kubectl get configmap "$CM" -n defectdojo \
      -o jsonpath='{.data.DD_CELERY_BROKER_HOST}' 2>/dev/null || echo "")
    if [ "$CURRENT_HOST" = "defectdojo-valkey-sentinel" ]; then
      echo "Broker config deja correcte - skip"
      exit 0
    fi
    VALKEY_PASS=$(kubectl get secret defectdojo-valkey-specific \
      -n defectdojo \
      -o jsonpath='{.data.valkey-password}' | base64 --decode)
    kubectl patch configmap "$CM" -n defectdojo \
      --type merge \
      -p "{\"data\":{
        \"DD_CELERY_BROKER_HOST\": \"defectdojo-valkey-sentinel\",
        \"DD_CELERY_BROKER_PORT\": \"26379\",
        \"DD_CELERY_BROKER_PATH\": \"/0\",
        \"DD_CELERY_BROKER_PARAMS\": \"\",
        \"DD_CELERY_BROKER_SCHEME\": \"sentinel\",
        \"DD_CELERY_BROKER_TRANSPORT_OPTIONS\": \"{\\\"master_name\\\": \\\"mymaster\\\", \\\"sentinel_kwargs\\\": {\\\"password\\\": \\\"${VALKEY_PASS}\\\"}}\"
      }}"
    echo "Broker ConfigMap corrige → defectdojo-valkey-sentinel:26379"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: broker_immediate_fix
  changed_when: "'corrige' in broker_immediate_fix.stdout"
  ignore_errors: true

- name: "[BROKER-FIX] Afficher résultat correction broker"
  debug:
    msg: "{{ broker_immediate_fix.stdout_lines }}"
  run_once: true

- name: "[BROKER-FIX] Redémarrer Celery si broker corrigé"
  shell: |
    kubectl rollout restart deployment/defectdojo-celery-worker -n defectdojo
    kubectl rollout restart deployment/defectdojo-celery-beat -n defectdojo
    echo "Celery redémarre avec la bonne config broker"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  when: broker_immediate_fix.changed
  ignore_errors: true

# ══════════════════════════════════════════════════════════════════════════════
# FIX CRITIQUE DB : Corriger le drift de schéma après Helm upgrade
# ══════════════════════════════════════════════════════════════════════════════

- name: "[DB-FIX] Attendre que le pod Django soit disponible pour les fixes DB"
  shell: |
    echo "→ Attente pod Django disponible..."
    for i in $(seq 1 40); do
      POD=$(kubectl get pod -n defectdojo -l defectdojo.org/component=django \
        --no-headers -o custom-columns=':metadata.name' 2>/dev/null | head -1)
      if [ -n "$POD" ]; then
        PHASE=$(kubectl get pod "$POD" -n defectdojo \
          -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
        echo "  Attempt $i — pod=$POD phase=$PHASE"
        if [ "$PHASE" = "Running" ]; then
          echo "✓ Pod Django disponible: $POD"
          echo "POD=$POD"
          exit 0
        fi
      else
        echo "  Attempt $i — aucun pod Django trouve"
      fi
      sleep 5
    done
    echo "⚠ Timeout attente pod Django"
    exit 1
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: django_pod_wait
  changed_when: false
  ignore_errors: true

- name: "[DB-FIX] Créer script Python pour fix is_authn_provider"
  copy:
    content: |
      from django.db import connection
      with connection.cursor() as c:
          c.execute("SELECT column_name FROM information_schema.columns WHERE table_name='dojo_cred_mapping' AND column_name='is_authn_provider'")
          if not c.fetchone():
              c.execute('ALTER TABLE dojo_cred_mapping ADD COLUMN IF NOT EXISTS is_authn_provider boolean NOT NULL DEFAULT false')
              print('FIXED: is_authn_provider added to dojo_cred_mapping')
          else:
              print('OK: is_authn_provider already exists')
    dest: /tmp/fix_dojo_db.py
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: "[DB-FIX] Fix connu — colonne is_authn_provider manquante sur dojo_cred_mapping"
  shell: |
    DJANGO_POD=$(kubectl get pod -n defectdojo -l defectdojo.org/component=django \
      --no-headers -o custom-columns=':metadata.name' 2>/dev/null | head -1)
    if [ -z "$DJANGO_POD" ]; then
      echo "Pod Django non trouve — skip"
      exit 0
    fi
    kubectl cp /tmp/fix_dojo_db.py defectdojo/$DJANGO_POD:/tmp/fix_dojo_db.py -c uwsgi 2>/dev/null || true
    kubectl exec -n defectdojo "$DJANGO_POD" -c uwsgi -- python manage.py shell < /tmp/fix_dojo_db.py
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: authn_provider_fix
  changed_when: "'FIXED:' in authn_provider_fix.stdout"
  ignore_errors: true

- name: "[DB-FIX] Afficher résultat fix is_authn_provider"
  debug:
    msg: "{{ authn_provider_fix.stdout_lines | default(['Skip']) }}"
  run_once: true

- name: "[DB-FIX] Créer script Python pour vérification drift DB"
  copy:
    content: |
      from django.db import connection
      from django.apps import apps

      fixes_applied = []
      errors = []

      with connection.cursor() as cursor:
          for model in apps.get_app_config('dojo').get_models():
              table = model._meta.db_table
              try:
                  cursor.execute(
                      "SELECT column_name FROM information_schema.columns WHERE table_name=%s",
                      [table]
                  )
                  db_cols = set(r[0] for r in cursor.fetchall())
                  if not db_cols:
                      continue
                  for field in model._meta.get_fields():
                      if not hasattr(field, 'column') or not hasattr(field, 'db_type'):
                          continue
                      if field.column in db_cols:
                          continue
                      try:
                          col_type = field.db_type(connection)
                          if not col_type:
                              continue
                          default_clause = ''
                          if hasattr(field, 'default') and field.default is not None:
                              import django.db.models as dm
                              if field.default is not dm.fields.NOT_PROVIDED:
                                  if callable(field.default):
                                      pass
                                  elif isinstance(field.default, bool):
                                      default_clause = 'DEFAULT ' + ('true' if field.default else 'false')
                                  elif isinstance(field.default, (int, float)):
                                      default_clause = 'DEFAULT ' + str(field.default)
                                  elif isinstance(field.default, str):
                                      safe_default = field.default.replace("'", "''")
                                      default_clause = "DEFAULT '" + safe_default + "'"
                          null_clause = ''
                          if not getattr(field, 'null', True):
                              if not default_clause:
                                  if 'bool' in col_type.lower():
                                      default_clause = 'DEFAULT false'
                                  elif 'int' in col_type.lower():
                                      default_clause = 'DEFAULT 0'
                                  elif 'char' in col_type.lower() or 'text' in col_type.lower():
                                      default_clause = "DEFAULT ''"
                              null_clause = 'NOT NULL'
                          sql = 'ALTER TABLE {} ADD COLUMN IF NOT EXISTS {} {} {} {}'.format(
                              table, field.column, col_type, null_clause, default_clause
                          ).strip()
                          cursor.execute(sql)
                          fixes_applied.append('{}.{} ({})'.format(table, field.column, col_type))
                      except Exception as e:
                          errors.append('{}.{} — {}'.format(table, field.column, str(e)[:80]))
              except Exception as e:
                  errors.append('TABLE {} — {}'.format(table, str(e)[:80]))

      if fixes_applied:
          for fix in fixes_applied:
              print('FIXED: ' + fix)
      else:
          print('SCHEMA_OK: aucun drift detecte')

      if errors:
          for err in errors:
              print('WARN: ' + err)
    dest: /tmp/check_dojo_drift.py
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: "[DB-FIX] Vérification et correction générique du drift de schéma DB"
  shell: |
    DJANGO_POD=$(kubectl get pod -n defectdojo -l defectdojo.org/component=django \
      --no-headers -o custom-columns=':metadata.name' 2>/dev/null | head -1)
    if [ -z "$DJANGO_POD" ]; then
      echo "Pod Django non trouve — skip"
      exit 0
    fi
    kubectl cp /tmp/check_dojo_drift.py defectdojo/$DJANGO_POD:/tmp/check_dojo_drift.py -c uwsgi 2>/dev/null || true
    kubectl exec -n defectdojo "$DJANGO_POD" -c uwsgi -- python manage.py shell < /tmp/check_dojo_drift.py
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: db_drift_fix
  changed_when: "'FIXED:' in db_drift_fix.stdout"
  ignore_errors: true

- name: "[DB-FIX] Afficher résultat correction drift DB"
  debug:
    msg: "{{ db_drift_fix.stdout_lines | default(['Skip']) }}"
  run_once: true

# ══════════════════════════════════════════════════════════════════════════════
# FIX CRITIQUE : Attendre et forcer recréation StatefulSet Valkey après Helm
# ══════════════════════════════════════════════════════════════════════════════

- name: "[HA-VALKEY] Attendre recréation StatefulSet Valkey par Helm"
  shell: |
    echo "→ Attente recreation StatefulSet Valkey..."
    for i in $(seq 1 30); do
      EXISTS=$(kubectl get statefulset defectdojo-valkey -n defectdojo \
        --ignore-not-found 2>/dev/null | grep -c defectdojo-valkey || echo "0")
      echo "  Attempt $i - StatefulSet existe: $EXISTS"
      if [ "$EXISTS" -ge 1 ]; then
        echo "✓ StatefulSet Valkey recree par Helm"
        exit 0
      fi
      sleep 5
    done
    echo "⚠ StatefulSet Valkey non recree — forcage via helm upgrade..."
    helm upgrade defectdojo defectdojo/defectdojo \
      --namespace defectdojo \
      --reuse-values \
      --set valkey.master.persistence.storageClass=nfs \
      --set valkey.master.persistence.size=8Gi \
      --set valkey.replica.persistence.storageClass=nfs \
      --set valkey.replica.persistence.size=8Gi \
      --timeout=10m 2>/dev/null || true
    echo "✓ Helm upgrade force"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: valkey_sts_wait
  changed_when: false
  ignore_errors: true

- name: "[HA-VALKEY] Afficher résultat attente StatefulSet"
  debug:
    msg: "{{ valkey_sts_wait.stdout_lines }}"
  run_once: true

- name: "[HA-VALKEY] Vérifier PVC Valkey après Helm"
  shell: |
    echo "→ Verification PVC Valkey apres Helm..."
    for i in $(seq 1 20); do
      COUNT=$(kubectl get pvc -n defectdojo 2>/dev/null | grep valkey | wc -l)
      SC=$(kubectl get pvc data-defectdojo-valkey-0 -n defectdojo \
        -o jsonpath='{.spec.storageClassName}' 2>/dev/null || echo "not_found")
      echo "  Attempt $i - PVC count=$COUNT storageClass=$SC"
      if [ "$COUNT" -ge 3 ] && [ "$SC" = "nfs" ]; then
        echo "✓ PVC Valkey crees en NFS"
        exit 0
      fi
      if [ "$COUNT" -ge 3 ] && [ "$SC" != "nfs" ]; then
        echo "⚠ PVC crees mais en $SC — probleme persistant !"
        kubectl get pvc -n defectdojo | grep valkey
        exit 1
      fi
      sleep 5
    done
    echo "⚠ PVC Valkey non crees apres 100s"
    kubectl get pvc -n defectdojo
    exit 1
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: valkey_pvc_check
  ignore_errors: true

- name: "[HA-VALKEY] Afficher état PVC Valkey"
  debug:
    msg: "{{ valkey_pvc_check.stdout_lines }}"
  run_once: true

# ══════════════════════════════════════════════════════════════════════════════
# FIX CRITIQUE IDEMPOTENT : Appliquer tolerations PostgreSQL après Helm
# ══════════════════════════════════════════════════════════════════════════════

- name: "[HA-PG-FIX] Appliquer tolerations courtes sur PostgreSQL StatefulSet"
  shell: |
    CURRENT=$(kubectl get statefulset defectdojo-postgresql -n defectdojo \
      -o jsonpath='{.spec.template.spec.tolerations}' 2>/dev/null || echo "")
    if echo "$CURRENT" | grep -q "tolerationSeconds.*30"; then
      echo "Tolerations deja presentes — skip"
      exit 0
    fi
    kubectl patch statefulset defectdojo-postgresql -n defectdojo \
      --type=json -p '[
        {
          "op": "add",
          "path": "/spec/template/spec/tolerations",
          "value": [
            {
              "key": "node.kubernetes.io/not-ready",
              "operator": "Exists",
              "effect": "NoExecute",
              "tolerationSeconds": 30
            },
            {
              "key": "node.kubernetes.io/unreachable",
              "operator": "Exists",
              "effect": "NoExecute",
              "tolerationSeconds": 30
            }
          ]
        }
      ]' 2>/dev/null && echo "✓ Tolerations appliquees" || echo "Patch echoue (non bloquant)"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: pg_tolerations_result
  changed_when: "'appliquees' in pg_tolerations_result.stdout"
  ignore_errors: true

- name: "[HA-PG-FIX] Afficher résultat tolerations PostgreSQL"
  debug:
    msg: "{{ pg_tolerations_result.stdout_lines }}"
  run_once: true

- name: "[HA-PG-FIX] Vérifier tolerations appliquées sur pod PostgreSQL"
  shell: |
    kubectl get statefulset defectdojo-postgresql -n defectdojo \
      -o jsonpath='{.spec.template.spec.tolerations}' 2>/dev/null \
      | python3 -m json.tool 2>/dev/null \
      || echo "StatefulSet non trouve"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: pg_tolerations_check
  changed_when: false
  ignore_errors: true

- name: "[HA-PG-FIX] Afficher tolerations PostgreSQL"
  debug:
    msg: "{{ pg_tolerations_check.stdout_lines }}"
  run_once: true

- name: "[HA-VALKEY-FIX] Appliquer tolerations 30s sur StatefulSet Valkey"
  shell: |
    CURRENT=$(kubectl get statefulset defectdojo-valkey -n defectdojo \
      -o jsonpath='{.spec.template.spec.tolerations}' 2>/dev/null || echo "")
    if echo "$CURRENT" | grep -q "tolerationSeconds.*30"; then
      echo "Tolerations 30s deja presentes sur Valkey — skip"
      exit 0
    fi
    kubectl patch statefulset defectdojo-valkey -n defectdojo \
      --type=json -p '[
        {
          "op": "replace",
          "path": "/spec/template/spec/tolerations",
          "value": [
            {
              "key": "node.kubernetes.io/not-ready",
              "operator": "Exists",
              "effect": "NoExecute",
              "tolerationSeconds": 30
            },
            {
              "key": "node.kubernetes.io/unreachable",
              "operator": "Exists",
              "effect": "NoExecute",
              "tolerationSeconds": 30
            }
          ]
        }
      ]' 2>/dev/null && echo "✓ Tolerations Valkey appliquees" \
                     || echo "Patch echoue (non bloquant)"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: valkey_tolerations_result
  changed_when: "'appliquees' in valkey_tolerations_result.stdout"
  ignore_errors: true

- name: "[HA-VALKEY-FIX] Afficher résultat tolerations Valkey"
  debug:
    msg: "{{ valkey_tolerations_result.stdout_lines }}"
  run_once: true

- name: "[HA-PG-FIX] Forcer PostgreSQL sur workers uniquement (nodeAffinity)"
  shell: |
    CURRENT=$(kubectl get statefulset defectdojo-postgresql -n defectdojo \
      -o jsonpath='{.spec.template.spec.affinity.nodeAffinity}' 2>/dev/null || echo "")
    if echo "$CURRENT" | grep -q "control-plane"; then
      echo "NodeAffinity workers deja configuree — skip"
      exit 0
    fi
    kubectl patch statefulset defectdojo-postgresql -n defectdojo \
      --type=json -p '[
        {
          "op": "add",
          "path": "/spec/template/spec/affinity",
          "value": {
            "nodeAffinity": {
              "requiredDuringSchedulingIgnoredDuringExecution": {
                "nodeSelectorTerms": [{
                  "matchExpressions": [{
                    "key": "node-role.kubernetes.io/control-plane",
                    "operator": "DoesNotExist"
                  }]
                }]
              }
            }
          }
        }
      ]' 2>/dev/null && echo "✓ NodeAffinity worker appliquee" || echo "Patch echoue (non bloquant)"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: pg_affinity_result
  changed_when: "'appliquee' in pg_affinity_result.stdout"
  ignore_errors: true

- name: "[HA-PG-FIX] Afficher résultat nodeAffinity PostgreSQL"
  debug:
    msg: "{{ pg_affinity_result.stdout_lines }}"
  run_once: true

- name: "[HA-PG-FIX] Reschedule PostgreSQL si sur master"
  shell: |
    NODE=$(kubectl get pod defectdojo-postgresql-0 -n defectdojo \
      -o jsonpath='{.spec.nodeName}' 2>/dev/null || echo "")
    if echo "$NODE" | grep -qiE "master|control"; then
      echo "→ PostgreSQL sur $NODE (master) — suppression pour reschedule sur worker..."
      kubectl delete pod defectdojo-postgresql-0 -n defectdojo \
        --grace-period=30 2>/dev/null
      echo "✓ Pod supprime — K8s reschedule sur worker grace a nodeAffinity"
    else
      echo "PostgreSQL sur '$NODE' — pas un master, skip reschedule"
    fi
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: pg_reschedule_result
  changed_when: "'supprime' in pg_reschedule_result.stdout"
  ignore_errors: true

- name: "[HA-PG-FIX] Afficher résultat reschedule PostgreSQL"
  debug:
    msg: "{{ pg_reschedule_result.stdout_lines }}"
  run_once: true

- name: "[HA-PG-FIX] Attendre PostgreSQL Running sur worker"
  shell: |
    for i in $(seq 1 40); do
      READY=$(kubectl get pod defectdojo-postgresql-0 -n defectdojo \
        -o jsonpath='{.status.containerStatuses[0].ready}' 2>/dev/null || echo "false")
      NODE=$(kubectl get pod defectdojo-postgresql-0 -n defectdojo \
        -o jsonpath='{.spec.nodeName}' 2>/dev/null || echo "?")
      echo "  Attempt $i — ready=$READY node=$NODE"
      if [ "$READY" = "true" ]; then
        if echo "$NODE" | grep -qiE "master|control"; then
          echo "⚠ PostgreSQL ready mais toujours sur $NODE (master)"
        else
          echo "✓ PostgreSQL operationnel sur $NODE (worker)"
        fi
        exit 0
      fi
      sleep 5
    done
    echo "⚠ Timeout PostgreSQL (non bloquant)"
    exit 0
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: pg_worker_ready
  changed_when: false
  ignore_errors: true
  when: pg_reschedule_result.changed

- name: "[HA-PG-FIX] Afficher état PostgreSQL après reschedule"
  debug:
    msg: "{{ pg_worker_ready.stdout_lines | default(['Skip — pas de reschedule necessaire']) }}"
  run_once: true

- name: "[HA-PG] Restaurer local-path comme StorageClass par défaut après helm upgrade"
  shell: |
    SC="{{ pg_current_sc.stdout | trim }}"
    if [ "$SC" = "nfs" ]; then
      echo "Deja sur NFS — skip restauration"
      exit 0
    fi
    echo "→ Retirer default de nfs..."
    kubectl patch storageclass nfs \
      -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"false"}}}' \
      2>/dev/null || true
    echo "→ Restaurer local-path comme default..."
    kubectl patch storageclass local-path \
      -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}' \
      2>/dev/null || true
    echo "✓ local-path restaure comme StorageClass par defaut"
    kubectl get storageclass
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: sc_restore_result
  changed_when: "'local-path restaure' in sc_restore_result.stdout"
  ignore_errors: true
  when: pg_current_sc.stdout | trim != 'nfs'

- name: "[HA-PG] Afficher résultat restauration StorageClass"
  debug:
    msg: "{{ sc_restore_result.stdout_lines | default(['Skip']) }}"
  run_once: true

# ══════════════════════════════════════════════════════════════════════════════
# FIX CRITIQUE IDEMPOTENT : Patch broker sentinel
# ══════════════════════════════════════════════════════════════════════════════

- name: Find ConfigMap containing DD_CELERY_BROKER_PATH
  shell: |
    kubectl get configmap -n defectdojo -o json \
      | python3 -c "
    import json, sys
    cms = json.load(sys.stdin)['items']
    for cm in cms:
        if 'DD_CELERY_BROKER_PATH' in cm.get('data', {}):
            print(cm['metadata']['name'])
            break
    " 2>/dev/null || echo ""
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: broker_configmap_name
  changed_when: false

- name: Display found ConfigMap name
  debug:
    msg: "ConfigMap broker trouve : {{ broker_configmap_name.stdout | trim }}"
  run_once: true

- name: Deploy broker patch script
  copy:
    dest: /tmp/broker_patch.sh
    mode: "0755"
    force: true
    content: |
      #!/bin/sh
      CM="$1"
      export KUBECONFIG=/home/ubuntu/.kube/config
      if [ -z "$CM" ] || [ "$CM" = "NOT_FOUND" ]; then
        echo "ConfigMap non trouve - skip"
        exit 0
      fi
      CURRENT_HOST=$(kubectl get configmap "$CM" -n defectdojo \
        -o jsonpath='{.data.DD_CELERY_BROKER_HOST}' 2>/dev/null || echo "")
      CURRENT_PORT=$(kubectl get configmap "$CM" -n defectdojo \
        -o jsonpath='{.data.DD_CELERY_BROKER_PORT}' 2>/dev/null || echo "")
      CURRENT_PATH=$(kubectl get configmap "$CM" -n defectdojo \
        -o jsonpath='{.data.DD_CELERY_BROKER_PATH}' 2>/dev/null || echo "")
      echo "Current: HOST=$CURRENT_HOST PORT=$CURRENT_PORT PATH=$CURRENT_PATH"
      if [ "$CURRENT_HOST" = "defectdojo-valkey-sentinel" ] \
        && [ "$CURRENT_PORT" = "26379" ] \
        && [ "$CURRENT_PATH" = "/0" ]; then
        echo "Broker config OK - sentinel:26379 /0 - nothing to do"
        exit 0
      fi
      echo "Patching $CM..."
      VALKEY_PASS=$(kubectl get secret defectdojo-valkey-specific \
        -n defectdojo \
        -o jsonpath='{.data.valkey-password}' | base64 --decode)
      kubectl patch configmap "$CM" -n defectdojo \
        --type merge \
        -p "{\"data\":{
          \"DD_CELERY_BROKER_HOST\": \"defectdojo-valkey-sentinel\",
          \"DD_CELERY_BROKER_PORT\": \"26379\",
          \"DD_CELERY_BROKER_PATH\": \"/0\",
          \"DD_CELERY_BROKER_PARAMS\": \"\",
          \"DD_CELERY_BROKER_SCHEME\": \"sentinel\",
          \"DD_CELERY_BROKER_TRANSPORT_OPTIONS\": \"{\\\"master_name\\\": \\\"mymaster\\\", \\\"sentinel_kwargs\\\": {\\\"password\\\": \\\"${VALKEY_PASS}\\\"}}\"
        }}"
      echo "Patch applique"
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Run broker patch script
  command: /tmp/broker_patch.sh {{ broker_configmap_name.stdout | trim }}
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: broker_patch_result
  changed_when: "'Patch applique' in broker_patch_result.stdout"
  ignore_errors: true

- name: Display broker patch result
  debug:
    msg: "{{ broker_patch_result.stdout_lines }}"
  run_once: true

- name: Restart Celery after broker patch
  shell: |
    kubectl rollout restart deployment/defectdojo-celery-worker -n defectdojo
    kubectl rollout restart deployment/defectdojo-celery-beat -n defectdojo
    kubectl rollout status deployment/defectdojo-celery-worker \
      -n defectdojo --timeout=120s 2>/dev/null || true
    echo "Celery restarted"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  when: broker_patch_result.changed
  ignore_errors: true

- name: Restart Django after broker patch
  shell: |
    kubectl rollout restart deployment/defectdojo-django -n defectdojo
    kubectl rollout status deployment/defectdojo-django \
      -n defectdojo --timeout=300s 2>/dev/null || true
    echo "Django restarted"
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  when: broker_patch_result.changed
  ignore_errors: true

